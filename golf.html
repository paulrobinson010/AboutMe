<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
  // iPhone Safari zooms in on any text box it thinks is small, and doesn't
  // zoom back out — tapping a player's name blew the page up. maximum-scale
  // stops that auto-zoom; iOS still lets you pinch-zoom regardless. Only on
  // iOS: Android doesn't auto-zoom, and there it would block pinch-zoom.
  if (/iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1))
    document.querySelector('meta[name="viewport"]').content += ", maximum-scale=1";
</script>
<meta name="theme-color" content="#07080f">
<title>Putt. — mini golf scorecard</title>
<meta name="description" content="A glow-in-the-dark mini golf scorecard. Any number of players, any number of holes. Nothing stored — the card lives in the link.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/syne-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Syne"; font-weight: 800; font-display: swap; src: url("assets/fonts/syne-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 500; font-display: swap; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; font-display: swap; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }

  /* Glow-in-the-dark crazy golf: blacklight carpet, neon balls, a windmill. */
  :root {
    --bg: #07080f;
    --ink: #f2f0ea;
    --muted: rgba(242, 240, 234, 0.55);
    --line: rgba(242, 240, 234, 0.12);
    --turf: #39ff88;
    --pink: #ff4fd8;
    --cyan: #25e3ee;
    --gold: #ffd23f;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    /* scores: Syne's flagged 1 reads as a 7 at a glance, which a scorecard
       can't afford — numbers use the body face, bold, with lining figures */
    --num: 700 1em/1 "Space Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100svh;
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 500;
    background:
      radial-gradient(90% 50% at 50% -10%, rgba(255, 79, 216, 0.18), transparent 70%),
      radial-gradient(70% 40% at 100% 100%, rgba(37, 227, 238, 0.12), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  .wrap { width: min(100%, 560px); margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); }
  .screen { display: none; }
  .screen.on { display: block; animation: in 0.45s var(--ease); }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } }
  .glow-pink { color: var(--pink); text-shadow: 0 0 8px var(--pink), 0 0 26px rgba(255, 79, 216, 0.6); }
  .home { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; color: var(--muted); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.14em; }

  /* ---------- the windmill ---------- */
  .windmill { display: block; width: min(100%, 300px); margin: 18px auto 0; overflow: visible; }
  /* One turn per cycle, starting as a "+" (a blade straight down, blocking
     the door). A blade covers the door at 0, ¼, ½ and ¾ of the cycle; the
     ball reaches the door at 37.5%, bang in the middle of a gap. */
  .windmill .blades { transform-box: view-box; transform-origin: 100px 52px; animation: spin 5s linear infinite; }
  /* The ball: up the fairway (shrinking as it goes away), between the
     blades, into the hole; out of the chute on the side, down to the
     lower green, into the cup. Moved in SVG units about its own centre. */
  .windmill .mill-ball { transform-box: view-box; transform-origin: 0 0; animation: roll-through 5s infinite; opacity: 0; }
  .windmill .pin { transform-box: view-box; transform-origin: 180px 151px; animation: pin-twitch 5s infinite; }
  /* Real putting physics: a struck ball only ever slows down (rolling
     friction, so its speed falls in a straight line), except going
     downhill. So: the ball sits on the tee, is putted at 16%, and slows
     all the way up the fairway — hard enough, and late enough, that it
     reaches the blades just as a gap opens (a blade is down at 25%, the
     gap is centred on 37.5%) and rolls into the hole still moving. The
     only speed-up is down the chute; then it slows along the lower green
     and drops in the cup. Each easing curve is a constant-deceleration
     (or acceleration) curve, and the speeds match where segments meet. */
  @keyframes roll-through {
    0%    { transform: translate(100px, 166px) scale(1.35); opacity: 0; animation-timing-function: linear; }
    3%    { transform: translate(100px, 166px) scale(1.35); opacity: 1; animation-timing-function: linear; }
    /* putted: speed falls from v to 0.3v by the door */
    16%   { transform: translate(100px, 166px) scale(1.35); opacity: 1; animation-timing-function: cubic-bezier(0.333, 0.513, 0.667, 0.847); }
    /* through the gap, into the hole at the speed it arrived with */
    37.5% { transform: translate(100px, 127px) scale(0.7);  opacity: 1; animation-timing-function: linear; }
    42%   { transform: translate(100px, 123px) scale(0.3);  opacity: 0; }
    49%   { transform: translate(130px, 131px) scale(0.55); opacity: 0; animation-timing-function: ease-out; }
    /* out of the chute and downhill: the one place it gathers speed */
    51%   { transform: translate(131px, 132px) scale(0.75); opacity: 1; animation-timing-function: cubic-bezier(0.333, 0, 0.667, 0.333); }
    /* along the lower green, slowing steadily to the cup */
    58%   { transform: translate(143px, 146px) scale(0.8);  opacity: 1; animation-timing-function: cubic-bezier(0.333, 0.667, 0.667, 1); }
    72%   { transform: translate(180px, 146px) scale(0.8);  opacity: 1; animation-timing-function: ease-in; }
    77%   { transform: translate(180px, 151px) scale(0.3);  opacity: 0; }
    100%  { transform: translate(180px, 151px) scale(0.3);  opacity: 0; }
  }

  @keyframes pin-twitch {
    0%, 76%, 100% { transform: rotate(0); }
    79% { transform: rotate(-5deg); }
    83% { transform: rotate(3deg); }
    87% { transform: rotate(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-family: "Syne", sans-serif;
    font-weight: 800;
    font-size: clamp(3.4rem, 18vw, 5.2rem);
    line-height: 0.9;
    text-align: center;
    letter-spacing: -0.02em;
    margin-top: 4px;
  }

  /* ---------- setup ---------- */
  .field {
    display: flex; align-items: center; gap: 12px;
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
  }
  .field:focus-within { border-color: var(--turf); box-shadow: 0 0 0 3px rgba(57, 255, 136, 0.15); }
  .field svg { flex: none; width: 26px; height: 26px; }
  /* 18px: comfortably over the 16px below which phones zoom in on focus,
     even with the browser's text a notch smaller */
  .field input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: max(18px, 1.1rem); padding: 6px 0; }
  .field input::placeholder { color: rgba(242, 240, 234, 0.35); }
  .holes { justify-content: space-between; }
  .holes .num { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 2rem; min-width: 2.2ch; text-align: center; color: var(--turf); text-shadow: 0 0 12px rgba(57, 255, 136, 0.6); }
  .step {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05);
    font-size: 1.4rem; line-height: 1;
  }
  .chips { display: flex; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 100px; border: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }
  .chip.on { border-color: var(--turf); color: var(--turf); box-shadow: 0 0 12px rgba(57, 255, 136, 0.3); }
  .players { margin-top: 14px; display: grid; gap: 10px; }
  .player-field { margin-top: 0; }
  .player-field .x { width: 34px; height: 34px; border-radius: 50%; color: var(--muted); font-size: 1.2rem; }
  .add {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; margin-top: 10px; padding: 14px;
    border-radius: 18px; border: 1.5px dashed rgba(242, 240, 234, 0.25);
    color: var(--muted);
  }
  .add:active { transform: scale(0.98); }

  /* a neon golf ball, dimples and all */
  .ball {
    --b: #fff;
    position: relative; flex: none;
    width: 30px; height: 30px; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.95) 0 9%, transparent 10%),
      radial-gradient(circle, rgba(0, 0, 0, 0.18) 0 1.4px, transparent 1.6px) 0 0 / 6px 6px,
      radial-gradient(circle at 38% 34%, color-mix(in srgb, var(--b) 55%, white), var(--b) 62%, color-mix(in srgb, var(--b) 70%, black));
    box-shadow: 0 0 10px color-mix(in srgb, var(--b) 70%, transparent), 0 0 24px color-mix(in srgb, var(--b) 35%, transparent);
    display: grid; place-items: center;
    font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.8rem; color: rgba(0, 0, 0, 0.72);
  }

  .cta {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(calc(100% - 32px), 528px);
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 18px;
    border-radius: 22px;
    background: var(--turf);
    color: #04130a;
    font-family: "Syne", sans-serif; font-weight: 800; font-size: 1.25rem; letter-spacing: 0.02em;
    box-shadow: 0 0 22px rgba(57, 255, 136, 0.55), 0 12px 40px rgba(0, 0, 0, 0.5);
    z-index: 20;
  }
  .cta:active { transform: translateX(-50%) scale(0.97); }
  .cta svg { width: 26px; height: 26px; }

  /* ---------- a hole ---------- */
  .bar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .bar .course { flex: 1; min-width: 0; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); }
  .icon-btn svg { width: 22px; height: 22px; }
  .hole-head { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .hole-head .nav { width: 52px; height: 52px; border-radius: 50%; font-size: 1.6rem; color: var(--muted); }
  .hole-head .nav:disabled { opacity: 0.2; }
  .hole-num { display: flex; align-items: flex-end; gap: 6px; }
  .hole-num svg { width: 46px; height: 64px; margin-bottom: 4px; }
  .hole-num b { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 4.4rem; line-height: 0.85; color: var(--ink); text-shadow: 0 0 22px rgba(255, 79, 216, 0.55); }
  .hole-num small { font-size: 1rem; color: var(--muted); margin-bottom: 6px; }
  .flags { display: flex; gap: 4px; justify-content: center; margin: 12px 0 18px; flex-wrap: wrap; }
  .flags i { width: 10px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); }
  .flags i.done { background: var(--turf); box-shadow: 0 0 6px var(--turf); }
  .flags i.now { background: var(--pink); box-shadow: 0 0 8px var(--pink); width: 18px; }

  .rows { display: grid; gap: 12px; }
  .row {
    --b: #fff;
    padding: 12px 12px 12px 14px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid var(--line);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .row.holed { border-color: color-mix(in srgb, var(--b) 55%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--b) 18%, transparent); }
  .row .who { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .row .who .name { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .who .tot { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.95rem; }
  .row .play { display: flex; align-items: center; gap: 10px; }

  /* the putting strip: tap for a shot, the ball rolls toward the cup */
  .green {
    position: relative; flex: 1; height: 58px;
    border-radius: 16px;
    background:
      repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.12) 0 2px, transparent 2px 9px),
      linear-gradient(180deg, #0e5a33, #0a4327);
    border: 2px solid rgba(57, 255, 136, 0.45);
    box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.6), 0 0 14px rgba(57, 255, 136, 0.15);
    overflow: hidden;
  }
  .green .cup {
    position: absolute; right: 10px; top: 50%;
    width: 46px; height: 46px; margin-top: -23px;
    border-radius: 50%;
    display: grid; place-items: center;
  }
  .green .cup::before {
    content: ""; position: absolute; width: 22px; height: 14px; border-radius: 50%;
    background: radial-gradient(#000 40%, #04140b);
    box-shadow: inset 0 3px 4px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 255, 255, 0.08);
    top: 22px;
    z-index: 1;
  }
  .green .cup svg { position: absolute; width: 26px; height: 40px; left: 18px; top: -6px; z-index: 3; }
  .green .putt-ball {
    position: absolute; top: 50%; left: 10px;
    width: 20px; height: 20px; margin-top: -10px;
    transition: left 0.75s var(--ease), transform 0.4s var(--ease), opacity 0.3s;
    pointer-events: none;
    z-index: 2;
  }
  .row.holed .green .putt-ball { transform: scale(0.55) translateY(10px); opacity: 0.9; }
  .green .tap-hint {
    position: absolute; left: 38px; top: 50%; transform: translateY(-50%);
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255, 255, 255, 0.35);
    pointer-events: none; transition: opacity 0.3s;
  }
  .row:not(.fresh) .tap-hint { opacity: 0; }
  .green:active { filter: brightness(1.15); }
  .score-ball { width: 52px; height: 52px; font-size: 1.35rem; }
  .score-ball.empty { background: none; box-shadow: none; border: 2px dashed rgba(255, 255, 255, 0.25); color: var(--muted); }
  .undo { width: 34px; height: 34px; border-radius: 50%; color: var(--muted); font-size: 1.1rem; }
  .undo:disabled { opacity: 0.2; }

  /* ---------- sheets ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 41;
    width: min(100%, 560px);
    transform: translate(-50%, 105%);
    transition: transform 0.45s var(--ease);
    padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
    border-radius: 28px 28px 0 0;
    background: #10121c;
    border: 1px solid var(--line); border-bottom: 0;
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
    max-height: 88svh; overflow-y: auto;
  }
  .sheet.on { transform: translate(-50%, 0); }
  .sheet .grab { width: 44px; height: 5px; border-radius: 5px; background: rgba(255, 255, 255, 0.2); margin: 0 auto 14px; }
  .sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-weight: 700; }
  .tray { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; justify-items: center; padding: 14px; border-radius: 22px; background: linear-gradient(#1a1d2b, #121420); box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.6); }
  .tray .ball { width: 52px; height: 52px; font-size: 1.1rem; transition: transform 0.2s var(--ease); }
  .tray .ball:active { transform: scale(0.9); }
  .tray .ball.sel { outline: 3px solid #fff; outline-offset: 3px; }
  .tray .ball.ace { --b: var(--gold); }
  .tray .ball.ace::after { content: "★"; position: absolute; top: -6px; right: -4px; font-size: 0.8rem; color: var(--gold); text-shadow: 0 0 6px var(--gold); }
  .tray .ball.dim { --b: #8a8fa3; }
  .clear { display: block; margin: 14px auto 0; padding: 10px 18px; color: var(--muted); border-radius: 100px; border: 1px solid var(--line); }

  .board { display: grid; gap: 8px; }
  .board .line { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(255, 255, 255, 0.04); }
  .board .pos { width: 28px; font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .board .line:first-child .pos { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
  .board .name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .sc { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.4rem; }
  .board .thru { font-size: 0.75rem; color: var(--muted); }

  /* ---------- windmill between holes ---------- */
  .between {
    position: fixed; inset: 0; z-index: 60;
    display: grid; place-items: center; align-content: center; gap: 4px;
    background: radial-gradient(60% 40% at 50% 45%, rgba(255, 79, 216, 0.22), transparent 70%), rgba(7, 8, 15, 0.94);
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .between.on { opacity: 1; pointer-events: auto; }
  .between .stage { width: min(80vw, 340px); }
  .between .stage svg { display: block; width: 100%; margin: 0; overflow: visible; }
  .between .windmill .mill-ball, .between .windmill .pin, .between .windmill .blades { animation: none; }
  .between.on .windmill .mill-ball { animation: roll-through 2.4s forwards; }
  .between.on .windmill .pin { animation: pin-twitch 2.4s forwards; }
  .between.on .windmill .blades { animation: spin 2.4s linear forwards; }
  /* the next hole's number, big and lit, once the ball's dropped */
  .between .next { display: flex; align-items: flex-end; gap: 10px; margin-top: 2px; opacity: 0; transform: scale(0.6) translateY(14px); }
  .between .next svg { width: 40px; height: 62px; margin-bottom: 12px; }
  .between .next b {
    font: 700 clamp(5.5rem, 30vw, 9rem)/0.85 "Space Grotesk", system-ui, sans-serif; font-variant-numeric: tabular-nums;
    color: var(--ink); text-shadow: 0 0 18px rgba(255, 79, 216, 0.75), 0 0 50px rgba(255, 79, 216, 0.45);
  }
  .between.on .next { animation: pop 0.45s var(--ease) 1.95s forwards; }
  @keyframes pop { to { opacity: 1; transform: none; } }

  /* the other obstacles: the ball is moved by script, the scenery by CSS */
  .hole-art .waves { animation: waves 1.1s linear infinite; }
  @keyframes waves { to { transform: translateX(-17px); } }
  .hole-art .duck { transform-box: fill-box; transform-origin: 50% 90%; animation: bob 1.5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(1.4px) rotate(-4deg); } }
  .hole-art .pin { transform-box: view-box; }
  .hole-art .pin.twitch { animation: twitch 0.7s ease-out; }
  @keyframes twitch { 25% { transform: rotate(-5deg); } 60% { transform: rotate(3deg); } }
  /* the volcano: smoking, glowing, and erupting once the ball's in */
  .volcano .lava { animation: lava 1.4s ease-in-out infinite; }
  @keyframes lava { 50% { opacity: 0.55; } }
  .volcano .smoke circle { transform-box: fill-box; transform-origin: center; animation: smoke 2.4s ease-out infinite; opacity: 0; }
  .volcano .smoke circle + circle { animation-delay: -1.2s; }
  @keyframes smoke { 0% { transform: translateY(6px) scale(0.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-16px) scale(1.4); opacity: 0; } }
  .volcano .sparks circle { opacity: 0; }
  .volcano.holed .sparks circle { animation: spark 1s cubic-bezier(0.2, 0.7, 0.4, 1) forwards; }
  @keyframes spark { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translate(var(--x), var(--y)); } }
  .volcano.holed .lava { animation: flare 0.8s ease-out; }
  @keyframes flare { 30% { opacity: 1; transform: scale(1.8); } }
  .volcano .lava { transform-box: fill-box; transform-origin: center; }
  /* the castle: the portcullis drops behind the ball */
  .castle .portcullis { transform: translateY(-38px); transition: transform 0.16s cubic-bezier(0.5, 0, 1, 1); }
  .castle.holed .portcullis { transform: none; }
  /* the clown: happy eyes and a honk of the nose once it's swallowed one */
  .clown .eyes-happy { opacity: 0; }
  .clown.holed .eyes-open { opacity: 0; }
  .clown.holed .eyes-happy { opacity: 1; }
  .clown .nose { transform-box: fill-box; transform-origin: center; }
  .clown.holed .nose { animation: honk 0.45s ease-out 0.05s; }
  @keyframes honk { 30% { transform: scale(1.35, 0.8); } 60% { transform: scale(0.9, 1.15); } }

  /* hole in one */
  .ace-flash {
    position: fixed; inset: 0; z-index: 70; pointer-events: none;
    display: grid; place-items: center;
    font-family: "Syne", sans-serif; font-weight: 800; font-size: clamp(2.6rem, 14vw, 5rem); text-align: center; line-height: 0.95;
    color: var(--gold); text-shadow: 0 0 10px var(--gold), 0 0 40px rgba(255, 210, 63, 0.7);
    opacity: 0;
  }
  .ace-flash.on { animation: ace 1.9s var(--ease); }
  @keyframes ace { 0% { opacity: 0; transform: scale(0.5) rotate(-6deg); } 15% { opacity: 1; transform: scale(1.08) rotate(2deg); } 30% { transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
  .confetti { position: fixed; inset: 0; z-index: 69; pointer-events: none; }

  .toast {
    position: fixed; left: 50%; top: max(18px, env(safe-area-inset-top)); z-index: 75;
    transform: translate(-50%, -140%);
    padding: 10px 18px; border-radius: 100px;
    background: #151827; border: 1px solid var(--line);
    font-weight: 700; white-space: nowrap;
    transition: transform 0.4s var(--ease);
  }
  .toast.on { transform: translate(-50%, 0); }

  /* ---------- the 19th hole ---------- */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 34px 0 24px; min-height: 230px; }
  .step-col { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 31%; }
  .step-col .ball { width: 44px; height: 44px; }
  .step-col .nm { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step-col .blk {
    width: 100%; border-radius: 16px 16px 6px 6px;
    display: grid; place-items: center; align-content: start; padding-top: 10px;
    font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.7rem;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.03));
    border: 1px solid var(--line);
  }
  .step-col.p1 .blk { height: 140px; border-color: var(--gold); box-shadow: 0 0 22px rgba(255, 210, 63, 0.35); color: var(--gold); }
  .step-col.p2 .blk { height: 100px; }
  .step-col.p3 .blk { height: 72px; }
  .step-col.p1 .crown { font-size: 1.8rem; filter: drop-shadow(0 0 8px var(--gold)); }
  .step-col .balls { display: flex; justify-content: center; }
  .step-col .balls .ball + .ball { margin-left: -12px; }   /* tied balls huddle together */
  .step-col.shared .ball { width: calc(44px - (var(--n) - 1) * 6px); height: calc(44px - (var(--n) - 1) * 6px); min-width: 26px; min-height: 26px; }
  .step-col .nm { text-align: center; white-space: normal; line-height: 1.2; }
  .step-col .tie {
    font-family: "Syne", sans-serif; font-weight: 800; font-size: 0.9rem; letter-spacing: 0.08em;
    color: var(--gold); text-shadow: 0 0 10px var(--gold);
    animation: tie-pulse 1.6s ease-in-out infinite;
  }
  @keyframes tie-pulse { 50% { opacity: 0.55; } }
  .awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .award { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); }
  .award .ico { font-size: 1.6rem; }
  .award b { display: block; font-size: 0.95rem; }
  .award span { font-size: 0.78rem; color: var(--muted); }
  .card-scroll { overflow-x: auto; border-radius: 18px; border: 1px solid var(--line); }
  table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 0.9rem; }
  th, td { padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 0.75rem; }
  td:first-child, th:first-child { text-align: left; position: sticky; left: 0; background: #0d0f18; }
  td.ace { color: var(--gold); text-shadow: 0 0 8px var(--gold); font-weight: 700; }
  td.total { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
  .again { display: flex; gap: 10px; margin-top: 18px; }
  .again button { flex: 1; padding: 14px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .done-mill .windmill { width: 150px; margin: 6px auto 0; }
  .save-card {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; margin-top: 18px; padding: 16px;
    border-radius: 20px; background: var(--turf); color: #04130a;
    font-family: "Syne", sans-serif; font-weight: 800; font-size: 1.15rem;
    box-shadow: 0 0 20px rgba(57, 255, 136, 0.5);
  }
  .save-card:active { transform: scale(0.98); }
  .save-card[disabled] { opacity: 0.6; }
  /* mid-round card: tap a hole number to go back to it */
  .card-scroll.mid { margin-top: 14px; }
  #mid-card th button { width: 100%; padding: 2px 0; color: inherit; border-radius: 8px; }
  #mid-card th.cur, #mid-card td.cur { background: rgba(255, 79, 216, 0.14); }
  #mid-card th.cur button { color: var(--pink); text-shadow: 0 0 8px var(--pink); font-weight: 700; }
  /* a reset needs a second tap: the first one arms it */
  .resets button { transition: border-color 0.2s, color 0.2s, background 0.2s; }
  .resets button.arm { border-color: #ff5a5a; color: #ff8a80; background: rgba(255, 90, 90, 0.10); }
  .deal { text-align: center; margin-top: 26px; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em; }

  /* ---------- live: friends watch the card as it's kept ---------- */
  .icon-btn { position: relative; }
  #go-live.on { color: #ff5a5a; border-color: rgba(255, 90, 90, 0.6); box-shadow: 0 0 14px rgba(255, 90, 90, 0.35); }
  #go-live .badge {
    position: absolute; top: -5px; right: -5px;
    min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
    background: #ff5a5a; color: #160404; font-size: 0.7rem; font-weight: 700; line-height: 19px; text-align: center;
  }
  #go-live .badge:empty { display: none; }
  .live-pill {
    display: inline-flex; align-items: center; gap: 7px; flex: none;
    padding: 6px 11px; border-radius: 100px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em;
    color: #ff6b6b; border: 1px solid rgba(255, 90, 90, 0.55); box-shadow: 0 0 12px rgba(255, 90, 90, 0.25);
  }
  .live-pill i { width: 8px; height: 8px; border-radius: 50%; background: #ff5a5a; box-shadow: 0 0 8px #ff5a5a; animation: tie-pulse 1.2s ease-in-out infinite; }
  .live-pill.off { color: var(--muted); border-color: var(--line); box-shadow: none; }
  .live-pill.off i { background: var(--muted); box-shadow: none; animation: none; }
  .live-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .live-head .eyes { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
  .qr {
    width: min(100%, 280px); aspect-ratio: 1; margin: 0 auto;
    border-radius: 24px; padding: 6px; background: #f2f0ea;
    box-shadow: 0 0 0 3px var(--pink), 0 0 30px rgba(255, 79, 216, 0.55);
  }
  .qr svg { display: block; width: 100%; height: 100%; }
  .live-sheet .deal { margin-top: 16px; }
  #live-stop { color: #ff8a80; }

  /* the watching screen */
  .w-wait { text-align: center; color: var(--muted); padding-top: 8vh; }
  .w-wait p { margin-top: 18px; letter-spacing: 0.08em; }
  .w-head { display: flex; justify-content: center; margin-top: 10px; }
  .w-champ { text-align: center; font-family: "Syne", sans-serif; font-weight: 800; font-size: clamp(1.8rem, 9vw, 2.6rem); line-height: 1.05; margin-top: 12px; color: var(--gold); text-shadow: 0 0 12px rgba(255, 210, 63, 0.6); }
  #w-board { margin-top: 4px; }
  #w-board .line { transition: box-shadow 0.4s, background 0.4s; }
  #w-board .line.bump { animation: bump 1.4s var(--ease); }
  @keyframes bump { 0% { background: rgba(255, 79, 216, 0.28); box-shadow: 0 0 22px rgba(255, 79, 216, 0.45); } }
  #w-card th.cur, #w-card td.cur { background: rgba(255, 79, 216, 0.14); }
  #w-card th.cur { color: var(--pink); text-shadow: 0 0 8px var(--pink); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .windmill .blades, .windmill .mill-ball, .windmill .pin { animation: none !important; }
    .screen.on { animation: none; }
    .green .putt-ball { transition: none; }
  }
</style>
</head>
<body>

<!-- one windmill, cloned wherever it's needed -->
<template id="windmill-tpl">
  <!-- Front-on, the way a real windmill hole looks from the tee: the ball
       rolls up the fairway, has to slip between the blades — which sweep
       right down to the ground in front of the door — and goes in the
       hole. It pops out of a chute on the side, rolls down to the lower
       green, and drops in the cup by the flag. -->
  <svg class="windmill" viewBox="0 -28 200 200" aria-hidden="true">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <!-- lower green, with the cup -->
    <path d="M138 150 L198 150 L198 160 L138 160 Z" fill="#0b4a2a" stroke="#39ff88" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)"/>
    <ellipse cx="180" cy="151" rx="6.5" ry="2.2" fill="#000"/>
    <!-- the chute from the windmill's side down to the lower green -->
    <path d="M130 134 L142 150" stroke="#39ff88" stroke-width="2" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>
    <!-- the fairway, running up to the door -->
    <path d="M28 172 L172 172 L122 132 L78 132 Z" fill="#0b4a2a" stroke="#39ff88" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- tower, with the hole through its base -->
    <path fill="#140e2a" stroke="#ff4fd8" stroke-width="2" stroke-linejoin="round" filter="url(#glow)" fill-rule="evenodd"
      d="M70 134 L84 56 L116 56 L130 134 Z M89 134 L89 117 A11 11 0 0 1 111 117 L111 134 Z"/>
    <path d="M78 58 L100 32 L122 58 Z" fill="#140e2a" stroke="#25e3ee" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="100" cy="84" r="5" fill="none" stroke="#ffd23f" stroke-width="1.6" filter="url(#glow)"/>
    <!-- the way out, on the side -->
    <ellipse cx="128.5" cy="129" rx="2.6" ry="4.2" fill="#000" stroke="#ff4fd8" stroke-width="1"/>
    <!-- the ball: a unit circle moved and sized by the animation -->
    <g class="mill-ball"><circle cx="0" cy="0" r="5" fill="#fff" filter="url(#glow)"/></g>
    <!-- blades, in front of the door, long enough to sweep the ground -->
    <g class="blades" filter="url(#glow)">
      <g stroke="#25e3ee" stroke-width="1.8" stroke-linejoin="round" fill="rgba(37,227,238,0.10)">
        <path d="M100 52 L93 -26 L107 -26 Z M100 30 L100 -20"/>
        <path d="M100 52 L178 45 L178 59 Z M122 52 L172 52"/>
        <path d="M100 52 L107 132 L93 132 Z M100 74 L100 126"/>
        <path d="M100 52 L22 59 L22 45 Z M78 52 L28 52"/>
      </g>
      <circle cx="100" cy="52" r="5" fill="#ff4fd8"/>
    </g>
    <!-- the flag -->
    <g class="pin">
      <line x1="180" y1="151" x2="180" y2="116" stroke="#f2f0ea" stroke-width="1.6"/>
      <path d="M180 116 L198 122 L180 128 Z" fill="#ff4fd8" filter="url(#glow)"/>
    </g>
  </svg>
</template>

    <g clip-path="url(#moat-k)"><path class="waves" d="M53 143 q4.25 -2.6 8.5 0 t8.5 0 q4.25 -2.6 8.5 0 t8.5 0 q4.25 -2.6 8.5 0 t8.5 0 q4.25 -2.6 8.5 0 t8.5 0 q4.25 -2.6 8.5 0 t8.5 0 q4.25 -2.6 8.5 0 t8.5 0" fill="none" stroke="#25e3ee" stroke-width="1.6" filter="url(#glow-k)"/></g>

<script>
/* Putt. — a mini golf scorecard.
   Nothing is stored: the whole card (course, players, scores, where you
   are) is encoded into the page's own address, so a reload keeps it and
   the link shares it, the same deal as the rest of the site. Nothing is
   sent either, unless the scorer goes live — and then only scrambled (see
   "live" below). */
(() => {
  const $ = (s, r) => (r || document).querySelector(s);
  const COLOURS = ["#ff4fd8", "#25e3ee", "#39ff88", "#ffa53d", "#a77bff", "#ffd23f", "#ff5a5a", "#f2f0ea", "#4d8bff", "#ff8fb1"];
  const MAX = 20;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- state, mirrored into the URL ------------------------------------
  let S = { c: "", h: 18, p: [{ n: "", k: 0 }, { n: "", k: 1 }], s: [], i: 0, d: 0 };
  // a watch link (#w=<room>.<key>) opens a read-only, live copy of someone's card
  const WATCH = location.hash.match(/^#w=([A-Za-z0-9_-]{16,64})\.([A-Za-z0-9_-]{43})$/);
  const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const dec = (t) => JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g, "+").replace(/_/g, "/")))));
  const save = () => {
    if (WATCH) return;   // a watcher's address is the watch link; leave it be
    try { history.replaceState(null, "", "#" + enc(S)); } catch (_) {}
    publish();
  };
  const load = () => {
    if (location.hash.length < 3) return false;
    try {
      const o = dec(location.hash.slice(1));
      if (!o || !Array.isArray(o.p) || !o.p.length) return false;
      S = Object.assign(S, o);
      S.h = clampH(S.h);
      S.s = (S.s || []).map((r) => Array.from({ length: S.h }, (_, j) => (r && r[j]) | 0));
      return true;
    } catch (_) { return false; }
  };
  const clampH = (n) => { n = Math.round(+n); return Number.isFinite(n) ? Math.max(1, Math.min(36, n)) : 18; };
  const colour = (pl) => COLOURS[pl.k % COLOURS.length];
  const nameOf = (pl, i) => (pl.n || "").trim() || "P" + (i + 1);
  const total = (pi) => (S.s[pi] || []).reduce((a, b) => a + (b || 0), 0);
  const played = (pi) => (S.s[pi] || []).filter((v) => v > 0).length;
  const ensureScores = () => {
    S.s = S.p.map((_, pi) => Array.from({ length: S.h }, (_, j) => (S.s[pi] && S.s[pi][j]) | 0));
  };

  // ---- little bits of theatre ------------------------------------------
  let sound = true, ac = null;
  const audio = () => {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
    if (ac && ac.state === "suspended") ac.resume().catch(() => {});
    return ac;
  };
  // phones only allow sound after a tap, so the first tap anywhere wakes it
  addEventListener("pointerdown", audio, { once: true });
  const tone = (f, t0, dur, type, vol) => {
    const a = audio(); if (!a || !sound) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, a.currentTime + t0);
    g.gain.setValueAtTime(0.0001, a.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, a.currentTime + t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + dur);
    o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + 0.02);
  };
  const sfx = {
    putt: () => { tone(1900, 0, 0.05, "triangle", 0.2); tone(700, 0.01, 0.06, "sine", 0.08); },
    cup: () => { tone(520, 0, 0.09, "sine", 0.2); tone(330, 0.09, 0.14, "sine", 0.22); tone(180, 0.2, 0.2, "sine", 0.18); },
    ace: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.22, "triangle", 0.16)),
    whoosh: () => { tone(220, 0, 0.5, "sawtooth", 0.03); tone(330, 0.15, 0.4, "sawtooth", 0.025); },
    tick: () => tone(1100, 0, 0.04, "triangle", 0.12),
    thud: () => { tone(90, 0, 0.18, "sine", 0.22); tone(140, 0, 0.06, "triangle", 0.08); },
    honk: () => { tone(330, 0.05, 0.11, "square", 0.06); tone(262, 0.18, 0.16, "square", 0.06); },
    clang: () => { tone(160, 0, 0.3, "square", 0.04); tone(1250, 0, 0.2, "triangle", 0.09); tone(1870, 0.01, 0.14, "triangle", 0.05); },
    rumble: () => { tone(55, 0, 0.8, "sawtooth", 0.07); tone(82, 0.05, 0.6, "sawtooth", 0.05); [0.12, 0.25, 0.34, 0.5].forEach((d, i) => tone(900 + i * 260, d, 0.03, "triangle", 0.05)); },
  };
  const buzz = (ms) => { if (navigator.vibrate) navigator.vibrate(ms); };

  let toastT = 0;
  const toast = (t) => { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 1500); };
  // a word for every result — mini golf has no par, so these are by strokes
  const VERDICT = ["", "ACE!", "Sweet", "Tidy", "Fine", "Meh", "Windmilled", "Windmilled", "Lost in the loop", "Lost in the loop", "Clown's mouth"];
  const verdict = (n) => n >= 20 ? "Picked it up" : n >= 10 ? "Clown's mouth" : VERDICT[n];

  const confetti = () => {
    if (reduced) return;
    const cv = $("#confetti"), x = cv.getContext("2d");
    const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
    const bits = Array.from({ length: 140 }, () => ({
      x: W / 2, y: H * 0.45, vx: (Math.random() - 0.5) * W * 0.03, vy: -Math.random() * H * 0.025 - H * 0.008,
      r: (3 + Math.random() * 5) * devicePixelRatio, c: COLOURS[(Math.random() * 7) | 0], a: Math.random() * 6,
    }));
    let f = 0;
    (function tick() {
      x.clearRect(0, 0, W, H);
      bits.forEach((b) => { b.vy += H * 0.0009; b.x += b.vx; b.y += b.vy; b.a += 0.2; x.fillStyle = b.c; x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); x.restore(); });
      if (++f < 120) requestAnimationFrame(tick); else x.clearRect(0, 0, W, H);
    })();
  };
  const ace = () => { sfx.ace(); buzz([30, 40, 30, 40, 80]); confetti(); const el = $("#ace"); el.classList.remove("on"); void el.offsetWidth; el.classList.add("on"); };

  document.querySelectorAll("[data-windmill]").forEach((h) => h.replaceWith($("#windmill-tpl").content.cloneNode(true)));
  document.querySelectorAll("[data-flag]").forEach((h) => h.replaceWith($("#flag-tpl").content.cloneNode(true)));

  // ---- screens -----------------------------------------------------------
  const show = (id) => {
    document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
    const cta = $("#cta");
    if (id === "setup") { cta.innerHTML = teeIcon + "Tee off"; cta.style.display = ""; }
    else if (id === "play") { cta.style.display = ""; paintCta(); }
    else cta.style.display = "none";
    scrollTo(0, 0);
  };
  const teeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="4"/><path d="M8 11h8l-3 3v7h-2v-7z"/></svg>';
  const millIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9l-2-7h4zM12 9l7-2v4zM12 9l2 7h-4zM12 9l-7 2V7z"/><path d="M9 22l1.5-8h3L15 22"/></svg>';
  const trophyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/></svg>';

  // ---- setup -------------------------------------------------------------
  const paintSetup = () => {
    $("#course").value = S.c;
    $("#holes-n").textContent = S.h;
    document.querySelectorAll("#hole-chips .chip").forEach((c) => c.classList.toggle("on", +c.dataset.h === S.h));
    const box = $("#players"); box.innerHTML = "";
    S.p.forEach((pl, i) => {
      const f = document.createElement("label");
      f.className = "field player-field";
      f.innerHTML = '<span class="ball"></span><input maxlength="20" autocomplete="off"><button class="x" aria-label="Remove player">&times;</button>';

  const rankKey = (s) => (s.thru ? s.t / s.thru : Infinity);

  // The windmill runs on CSS. The others are rolled by a little physics

  // flies the pond and loses pace off each zig-zag wall like a real one.
  // The putt is just hard enough to die into the cup. Played back at about

  const COURSES = {
    // side on: ball rides on the surface paths (offset by its radius)
    loop: {
      // round the inside of the loop (r44 about 82,88) as four quarter curves
      legs: ["M14 132 L82 132 C106.3 132 126 112.3 126 88 C126 63.7 106.3 44 82 44 C57.7 44 38 63.7 38 88 C38 112.3 57.7 132 82 132 L118 132 C134 132 146 108 162 108 L196 108"],

      mu: (x, y) => (x < 132 && y < 124 ? 40 : 480),     // the loop's a slick steel track; the rest is carpet
    },
    water: {
      legs: ["M12 128 L38 128 C54 128 62 124 70 118", "M140 128 L198 128"],   // off the end of the first, it flies
      side: true, g: 700, cup: [176, 123], hole: [180, 132], bounce: [0.3, 0.6],   // a dead bounce on landing
      mu: (x) => (x > 138 ? 300 : 170),

    // putted just hard enough to crawl over the rim, then down into the crater

      legs: ["M8 140 L50 140 C78 140 96 100 106 64 C108 57 114 55 117 59 C121 66 124 71 127 71 C130 71 133 66 137 59"],
      side: true, g: 700, cup: [127, 66], hole: [127, 73], aim: { at: [112, 51], v: 45 },
      mu: () => 170, sound: "rumble",

    // the drawbridge comes down, then the putt: over the moat, in at the gate
    castle: {
      legs: ["M8 136 L156 136"],
      side: true, g: 700, cup: [133, 131], hole: [136, 131], sink: 0.5,
      mu: () => 120, sound: "clang",
      frame: (svg, t, A) => {
        const p = Math.max(0, Math.min(1, (t - 0.05) / (A.strike - 0.1))), a = 90 * (1 - p * p);   // falls, gathering pace
        $(".bridge", svg).setAttribute("transform", "rotate(" + a.toFixed(2) + " 120 136)");
        const r = a * Math.PI / 180;
        $(".chain", svg).setAttribute("d", "M" + (120 - 48 * Math.cos(r)).toFixed(2) + " " + (136 - 48 * Math.sin(r)).toFixed(2) + " L121 94");
        if (p >= 1 && !A.thud) { A.thud = true; sfx.thud(); }
      },
    },
    // from above: the path is the ball's centre, corners are wall bounces
    zigzag: {
      legs: ["M28 150 L180 118.5 L20 70.2 L150 24 L158 21.2"],
      side: false, g: 0, cup: [150, 24], hole: [150, 24], e: 0.72,
      mu: () => 200,

    clown: {
      legs: ["M100 168 L100 116"],
      side: false, g: 0, cup: [100, 126], hole: [100, 129], persp: [168, 1.35, 126, 0.72],

  const R = 5, HZ = 1200;   // ball radius; simulation steps a second
  // A track (absolute M, L and C only) as points every half unit: done by
  // hand, as the browser's own path measuring is slow on curves.
  const measure = (d, off) => {
    const tk = d.match(/[MLC]|-?[\d.]+/g), raw = [];
    let i = 0, cmd = "", x = 0, y = 0;
    while (i < tk.length) {
      if (/[MLC]/.test(tk[i])) cmd = tk[i++];
      if (cmd === "C") {
        const [x1, y1, x2, y2, x3, y3] = tk.slice(i, i + 6).map(Number); i += 6;
        for (let k = 1; k <= 48; k++) {
          const t = k / 48, u = 1 - t;

        }
        x = x3; y = y3;
      } else { x = +tk[i]; y = +tk[i + 1]; i += 2; raw.push([x, y]); }
    }
    const rc = [0];
    for (let k = 1; k < raw.length; k++) rc.push(rc[k - 1] + Math.hypot(raw[k][0] - raw[k - 1][0], raw[k][1] - raw[k - 1][1]));
    const L = rc[rc.length - 1], N = Math.ceil(L / 0.5), px = [], py = [], xs = [], ys = [];
    for (let k = 0, j = 0; k <= N; k++) {
      const l = L * k / N;
      while (j < raw.length - 2 && rc[j + 1] < l) j++;
      const f = (l - rc[j]) / ((rc[j + 1] - rc[j]) || 1);
      px.push(raw[j][0] + (raw[j + 1][0] - raw[j][0]) * f); py.push(raw[j][1] + (raw[j + 1][1] - raw[j][1]) * f);
    }
    for (let i = 0; i <= N; i++) {
      const a = Math.max(0, i - 1), b = Math.min(N, i + 1);
      const h = Math.hypot(px[b] - px[a], py[b] - py[a]) || 1, tx = (px[b] - px[a]) / h, ty = (py[b] - py[a]) / h;
      xs.push(px[i] + ty * off); ys.push(py[i] - tx * off);   // up off the surface (or in, round the loop)
    }
    const cum = [0], corners = [];
    for (let i = 1; i <= N; i++) cum.push(cum[i - 1] + Math.hypot(xs[i] - xs[i - 1], ys[i] - ys[i - 1]));
    for (let i = 1; i < N; i++) {
      const a1 = Math.atan2(ys[i] - ys[i - 1], xs[i] - xs[i - 1]), a2 = Math.atan2(ys[i + 1] - ys[i], xs[i + 1] - xs[i]);
      let da = Math.abs(a2 - a1); if (da > Math.PI) da = 2 * Math.PI - da;
      if (da > 0.5 && !(corners.length && i - corners[corners.length - 1] < 4)) corners.push(i);

    return { xs, ys, cum, L: cum[N], corners: corners.map((i) => cum[i]) };
  };
  const at = (g, s) => {   // position and dy/ds at arc length s
    let lo = 0, hi = g.cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (g.cum[m] <= s) lo = m; else hi = m; }
    const span = g.cum[hi] - g.cum[lo] || 1, f = Math.max(0, Math.min(1, (s - g.cum[lo]) / span));
    return { x: g.xs[lo] + (g.xs[hi] - g.xs[lo]) * f, y: g.ys[lo] + (g.ys[hi] - g.ys[lo]) * f, slope: (g.ys[hi] - g.ys[lo]) / span,
      tx: (g.xs[hi] - g.xs[lo]) / span, ty: (g.ys[hi] - g.ys[lo]) / span };
  };
  // cupS: stop there (the run to play). aimS: note the speed passing it.
  const simulate = (c, legs, v0, cupS, aimS) => {
    const dt = 1 / HZ, out = [], ev = [];
    let li = 0, s = 0, v = v0, fly = null, x = legs[0].xs[0], y = legs[0].ys[0], aimV = null;
    const done = (more) => Object.assign({ out, ev, li, s, aimV }, more);
    for (let k = 0; k < 60000; k++) {
      if (fly) {
        fly.vy += c.g * dt; x += fly.vx * dt; y += fly.vy * dt;
        const nl = legs[li + 1];
        if (y > 175) return done({ fell: true });
        if (x >= nl.xs[0] && y >= nl.ys[0]) {
          y = nl.ys[0];
          if (fly.vy > 30) { fly.vy *= -c.bounce[0]; fly.vx *= c.bounce[1]; ev.push(out.length); }   // a bounce
          else { li++; s = x - nl.xs[0]; v = fly.vx; fly = null; }
        }
      } else {
        const g = legs[li], P = at(g, s), grav = c.g * P.slope, mu = c.mu(P.x, P.y);
        x = P.x; y = P.y;
        if (Math.abs(v) < 0.5 && Math.abs(grav) <= mu) return done();
        const dir = v ? Math.sign(v) : Math.sign(grav);
        const nv = v + (grav - mu * dir) * dt;
        v = v && Math.sign(nv) !== Math.sign(v) && Math.abs(grav) <= mu ? 0 : nv;
        if (v < 0) return done();   // didn't make it (the loop, the ramp, the volcano): not this putt
        const s2 = s + v * dt;
        if (aimS != null && aimV == null && li === 0 && s < aimS && s2 >= aimS) aimV = v;

      // back from the pocket: check the line is still alive
      const asked = Date.now();
      try { ws.send("ping"); } catch (_) {}
      setTimeout(() => { if (ws && heard < asked) { drop(); connect(); } }, 4000);
    };
    document.addEventListener("visibilitychange", wake);
    addEventListener("online", wake);
    connect();
    return {
      send: (o) => { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; },
      stop: () => { stopped = true; clearTimeout(t); document.removeEventListener("visibilitychange", wake); removeEventListener("online", wake); drop(); },
    };
  };
  const paintPill = (el, st) => { el.classList.toggle("off", st !== "on"); el.lastChild.textContent = st === "on" ? "LIVE" : st === "connecting" ? "…" : st === "off" ? "OFFLINE" : st; };

  // -- the scorer's side
  let host = null, hostKey = null, hostState = "off", watchers = 0, pubT = 0, beat = 0, outs = [];
  // A tapped shot isn't a result — only a ball in the cup is. Hole-outs go
  // along with the card (the last few, time-stamped) so watchers can cheer
  // the right moment: an ace, or "Paul · Tidy".
  function holedOut(pi, n) {
    if (!host) return;
    outs = outs.concat({ q: Date.now(), p: pi, n }).slice(-6);
  }
  const watchUrl = () => location.href.split("#")[0] + "#w=" + S.L.r + "." + S.L.k;
  function publish() {
    if (!host) return;
    clearTimeout(pubT);
    pubT = setTimeout(async () => {
      const { L, ...card } = S;
      card.at = Date.now();
      card.e = outs;
      try { host.send({ t: "s", v: await seal(await hostKey, card) }); } catch (_) {}
    }, 120);
  }
  const startHost = () => {
    if (host || !S.L) return;
    hostKey = importKey(S.L.k);
    host = Link(S.L.r, (m) => {
      if (m.t === "open" || m.t === "hi") publish();   // someone new: send them the card
      else if (m.t === "n") { watchers = Math.max(0, (m.n | 0) - 1); paintLive(); }
    }, (st) => { hostState = st; if (st !== "on") watchers = 0; paintLive(); });
    // "still here": lets watchers tell a scorer between holes from one who's gone
    beat = setInterval(() => host && host.send({ t: "h" }), 20000);
  };
  function stopLive() {
    if (host) { host.send({ t: "bye" }); host.stop(); }   // tell watchers it's over
    clearInterval(beat);
    host = null; watchers = 0; hostState = "off"; outs = [];
    if (S.L) { delete S.L; save(); }
    paintLive();
  }
  const paintLive = () => {
    const btn = $("#go-live");
    btn.classList.toggle("on", !!host);
    $(".badge", btn).textContent = host && watchers ? watchers : "";
    paintPill($("#live-pill"), hostState);
    $("#live-eyes").textContent = host ? "👀 " + watchers : "";
  };
  let qrLib = null;
  const loadQR = () => qrLib || (qrLib = new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = "assets/vendor/qrcode.js"; sc.onload = () => ok(window.qrcode); sc.onerror = () => { qrLib = null; no(); };
    document.head.appendChild(sc);
  }));
  const paintQR = async () => {
    const box = $("#live-qr"), url = watchUrl();
    if (box.dataset.url === url) return;
    box.innerHTML = ""; box.dataset.url = url;
    try {
      const qr = (await loadQR())(0, "L");   // a clean screen, so low error correction: fewer, bigger squares
      qr.addData(url); qr.make();
      const n = qr.getModuleCount(); let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += "M" + c + " " + r + "h1v1h-1z";
      box.innerHTML = '<svg viewBox="-2 -2 ' + (n + 4) + " " + (n + 4) + '" shape-rendering="crispEdges" role="img" aria-label="QR code for the watch link"><path fill="#07080f" d="' + d + '"/></svg>';
    } catch (_) { box.dataset.url = ""; }
  };
  $("#go-live").addEventListener("click", async () => {
    if (!S.L) {
      if (!(window.crypto && crypto.subtle)) return toast("This browser can't go live");
      const k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
      S.L = { r: b64u(crypto.getRandomValues(new Uint8Array(16))), k: b64u(await crypto.subtle.exportKey("raw", k)) };
      save();
    }
    startHost(); paintLive(); paintQR();
    openSheet("#live-sheet");
  });
  $("#live-share").addEventListener("click", async () => {
    if (!S.L) return;
    const url = watchUrl();
    try {
      if (navigator.share) await navigator.share({ title: (S.c || "Mini golf") + " — live", url });
      else { await navigator.clipboard.writeText(url); toast("Link copied"); }
    } catch (_) {}
  });
  $("#live-stop").addEventListener("click", () => { stopLive(); closeSheets(); toast("No longer live"); });

  // -- the watcher's side
  const startWatch = async ([, room, k]) => {
    document.title = "Putt. — live";
    show("watch");
    let key;
    try { key = await importKey(k); } catch (_) { $("#w-wait-msg").textContent = "That link doesn't look right"; return; }
    // LIVE only while the scorer is actually broadcasting: heard from in
    // the last 50s (the card, or the scorer's 20s "still here"); PAUSED if
    // their phone has gone quiet (locked, say); ENDED once they stop.
    let last = 0, first = true, sock = "connecting", heardHost = 0, ended = false, lastOut = 0;
    const pill = () => paintPill($("#w-pill"),
      sock !== "on" ? sock : ended ? "ENDED" : Date.now() - heardHost < 50000 ? "on" : heardHost ? "PAUSED" : "connecting");
    setInterval(pill, 5000);
    const link = Link(room, async (m) => {
      if (m.t === "open") link.send({ t: "hi" });
      else if (m.t === "h") { heardHost = Date.now(); ended = false; pill(); }
      else if (m.t === "bye") { ended = true; pill(); }
      else if (m.t === "s" && typeof m.v === "string") {
        let o;
        try { o = await unseal(key, m.v); } catch (_) { return; }   // not for us
        if (!o || !Array.isArray(o.p) || !o.p.length || !Array.isArray(o.s) || (+o.at || 0) < last) return;
        last = +o.at || 0;
        heardHost = Date.now(); ended = false; pill();
        const was = first ? null : JSON.parse(JSON.stringify(S));
        S = {
          c: String(o.c || "").slice(0, 60), h: clampH(o.h), i: 0, d: o.d ? 1 : 0, dt: typeof o.dt === "string" ? o.dt.slice(0, 10) : "",
          p: o.p.slice(0, 64).map((pl) => ({ n: String((pl && pl.n) || "").slice(0, 20), k: Math.abs((pl && pl.k) | 0) })),
          s: o.s,
        };
        S.i = Math.max(0, Math.min(S.h - 1, o.i | 0));
        S.s = S.p.map((_, pi) => Array.from({ length: S.h }, (_, j) => Math.max(0, Math.min(MAX, (o.s[pi] && o.s[pi][j]) | 0))));
        // hole-outs since the last card (none to cheer on the first one: that's history)
        const outs = (Array.isArray(o.e) ? o.e : []).filter((e) => e && +e.q > lastOut && S.p[e.p | 0]).sort((a, b) => a.q - b.q);
        if (outs.length) lastOut = +outs[outs.length - 1].q;
        first = false;
        paintWatch(was, was ? outs : []);
      }
    }, (st) => { sock = st; pill(); });
  };
  const paintWatch = (was, outs) => {
    $("#w-wait").hidden = true; $("#w-game").hidden = false;
    $("#w-course").textContent = S.c || "Mini golf";
    $("#w-hole").textContent = S.i + 1; $("#w-of").textContent = "/" + S.h;
    $("#w-hole-head").hidden = !!S.d;
    const champ = $("#w-champ"), wins = winners(standings());
    champ.hidden = !S.d;
    champ.textContent = S.d && wins.length ? "🏆 " + wins.map((w) => nameOf(w.pl, w.pi)).join(" & ") : "";
    $("#w-save").hidden = !S.d;
    paintFlags($("#w-flags")); $("#w-flags").hidden = !!S.d;
    paintBoard($("#w-board"));
    buildCard($("#w-card"), false, !S.d);
    const wrap = $("#w-card").parentNode, cur = $("#w-card th.cur");
    if (cur) wrap.scrollLeft = Math.max(0, cur.offsetLeft - wrap.clientWidth / 2 + cur.offsetWidth / 2);
    if (!was) return;
    // the fun bits, as they happen on the course
    S.p.forEach((pl, pi) => {
      const before = (was.s[pi] || []), now = S.s[pi];
      if (now.some((v, j) => v !== (before[j] | 0))) {
        const l = $('#w-board .line[data-pi="' + pi + '"]');
        if (l) { l.classList.remove("bump"); void l.offsetWidth; l.classList.add("bump"); }
      }
    });
    outs.forEach((e) => {
      const n = e.n | 0, who = nameOf(S.p[e.p | 0], e.p | 0);
      if (n === 1) { ace(); toast(who + " · ACE!"); } else if (n > 1) { sfx.cup(); toast(who + " · " + verdict(n)); }
    });
    if (S.d && !was.d) { sfx.ace(); confetti(); }
    else if (!S.d && S.i === was.i + 1 && !reduced) millShow(S.i + 1);
  };

  // ---- go --------------------------------------------------------------
  if (WATCH) startWatch(WATCH);
  else if (load()) {
    ensureScores();
    startHost();   // was live before a reload: carry on
    paintLive();
    if (S.d) finish();
    else if (S.t || S.s.some((r) => r.some((v) => v > 0))) { show("play"); paintHole(); }
    else { paintSetup(); show("setup"); }
  } else { ensureScores(); paintSetup(); show("setup"); }
})();
</script>
</body>
</html>
