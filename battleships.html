<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<title>Battleships. — sink the fleet</title>
<meta name="description" content="Glow-in-the-dark battleships. Take on the computer, a friend on the same phone, or a friend on their own phone by QR code. Nothing stored.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/syne-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Syne"; font-weight: 800; font-display: swap; src: url("assets/fonts/syne-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 500; font-display: swap; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; font-display: swap; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }

  /* Night at sea on a sonar screen: cyan water, neon hulls, orange fire. */
  :root {
    --bg: #07080f;
    --ink: #f2f0ea;
    --muted: rgba(242, 240, 234, 0.55);
    --line: rgba(242, 240, 234, 0.12);
    --sea: #25e3ee;
    --hit: #ff7a2f;
    --pink: #ff4fd8;
    --gold: #ffd23f;
    --turf: #39ff88;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  body {
    min-height: 100svh; color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 500;
    background:
      radial-gradient(90% 50% at 50% -10%, rgba(37, 227, 238, 0.16), transparent 70%),
      radial-gradient(70% 40% at 100% 100%, rgba(255, 122, 47, 0.1), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow-x: hidden;
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .wrap { width: min(100%, 520px); margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); position: relative; }
  .home { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; color: var(--muted); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.14em; }
  .sound { position: absolute; top: max(6px, env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .sound svg { width: 20px; height: 20px; }
  h1 { font-family: "Syne", sans-serif; font-weight: 800; font-size: clamp(1.8rem, 9.4vw, 3rem); line-height: 0.95; letter-spacing: -0.02em; text-align: center; margin-top: 26px; }
  h1 span { color: var(--sea); text-shadow: 0 0 8px var(--sea), 0 0 26px rgba(37, 227, 238, 0.6); }
  .small { text-align: center; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.78rem; }

  .seg { display: flex; gap: 6px; padding: 5px; margin: 16px auto 0; border-radius: 100px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); }
  .seg button { flex: 1; padding: 10px 0; border-radius: 100px; font-weight: 700; color: var(--muted); transition: background 0.2s, color 0.2s; white-space: nowrap; font-size: 0.9rem; }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .seg.lv { margin-top: 8px; }
  .seg.lv button { font-size: 0.84rem; padding: 8px 0; }

  /* ---------- the score ---------- */
  .score { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; font-weight: 700; }
  .score span { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .score b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .score b.bump { animation: bump 0.6s var(--ease); }
  @keyframes bump { 30% { transform: scale(1.5); color: var(--gold); text-shadow: 0 0 12px var(--gold); } }
  .score i { font-style: normal; color: var(--muted); }

  /* ---------- the grids ---------- */
  .grid { position: relative; width: min(100%, 380px, 48svh); aspect-ratio: 1; margin: 10px auto 0; touch-action: none; }
  .grid svg { display: block; width: 100%; height: 100%; overflow: visible; }
  #g-place { width: min(100%, 380px, 44svh); }
  .below { display: flex; align-items: center; gap: 14px; width: min(100%, 380px); margin: 12px auto 0; }
  .grid.mini { flex: none; width: min(44%, 170px, 24svh); margin: 0; }
  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .side .status { margin-top: 0; min-height: 70px; }
  .side .status b { font-size: clamp(1.3rem, 6.4vw, 1.9rem); }
  .water { fill: rgba(37, 227, 238, 0.05); stroke: rgba(37, 227, 238, 0.55); stroke-width: 0.6; }
  .lines line { stroke: rgba(37, 227, 238, 0.18); stroke-width: 0.25; }
  .sweep { transform-box: view-box; transform-origin: 50px 50px; animation: sweep 4s linear infinite; pointer-events: none; }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .grid.mini .sweep { display: none; }
  .ship rect { stroke-width: 0.9; }
  .ship.drag rect { stroke-dasharray: 2 1.2; }
  .ship.bad rect { stroke: #ff5a5a !important; fill: rgba(255, 90, 90, 0.2) !important; }
  .ship.sunk rect { stroke: var(--hit) !important; fill: rgba(255, 122, 47, 0.18) !important; animation: sunk 1.2s ease-in-out infinite alternate; }
  @keyframes sunk { to { opacity: 0.55; } }
  .ship.ghost rect { stroke-dasharray: 1.6 1.2; opacity: 0.75; }
  .miss { fill: var(--sea); }
  .miss.new { transform-box: fill-box; transform-origin: center; animation: plop 0.5s var(--ease); }
  @keyframes plop { from { transform: scale(3); opacity: 0; } }
  .ring { fill: none; stroke: var(--sea); stroke-width: 0.6; transform-box: fill-box; transform-origin: center; animation: ripple 0.9s ease-out forwards; }
  @keyframes ripple { from { transform: scale(0.3); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
  .hitm path { stroke: var(--hit); stroke-width: 1.4; stroke-linecap: round; }
  .hitm circle { fill: var(--hit); }
  .hitm.new { transform-box: fill-box; transform-origin: center; animation: boom 0.55s var(--ease); }
  @keyframes boom { 0% { transform: scale(2.6); } 40% { transform: scale(0.8); } 100% { transform: none; } }
  .spark { fill: var(--gold); transform-box: fill-box; transform-origin: center; animation: spark 0.7s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; } }
  /* the bomb: whistles in from the sky, its shadow growing under it */
  .fx > * { transform-box: fill-box; transform-origin: center; animation-fill-mode: both !important; }
  .bomb { animation: drop 0.42s cubic-bezier(0.5, 0, 0.9, 0.6) forwards; }
  .bomb .body { fill: #1b1e2e; stroke: var(--pink); stroke-width: 0.5; }
  .bomb .fin { fill: var(--pink); }
  @keyframes drop { 0% { transform: translate(var(--fx), -42px) scale(2.3) rotate(var(--fr)); opacity: 0; } 18% { opacity: 1; } 100% { transform: none; opacity: 1; } }
  .shadow { fill: #000; opacity: 0.45; animation: shadow 0.42s ease-in forwards; }
  @keyframes shadow { from { transform: scale(0.15); opacity: 0; } }
  /* a hit: a flash, a fireball, a shockwave, sparks, then smoke drifting off */
  .flash { fill: #fff; animation: flash 0.3s ease-out forwards; }
  @keyframes flash { from { transform: scale(0.4); opacity: 1; } to { transform: scale(4.2); opacity: 0; } }
  .fire { animation: fire 0.7s ease-out forwards; }
  @keyframes fire { 0% { transform: scale(0.15); opacity: 1; } 35% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
  .shock { fill: none; stroke: var(--hit); stroke-width: 0.7; animation: ripple 0.55s ease-out forwards; }
  .smoke { fill: #8f93a8; opacity: 0; animation: smoke 1.3s ease-out forwards; }
  @keyframes smoke { 0% { transform: scale(0.4); opacity: 0; } 20% { opacity: 0.5; } 100% { transform: translate(var(--dx), -16px) scale(2.2); opacity: 0; } }
  /* a miss: a column of water, droplets thrown up and falling back, foam, rings */
  .foam { fill: #dffbff; animation: foam 0.5s ease-out forwards; }
  @keyframes foam { from { transform: scale(0.2); opacity: 0.95; } to { transform: scale(1.6); opacity: 0; } }
  .column { fill: #9ff3fa; transform-origin: 50% 100% !important; animation: column 0.6s ease-out forwards; }
  @keyframes column { 0% { transform: scaleY(0) scaleX(0.6); opacity: 0.95; } 40% { transform: scaleY(1); opacity: 0.9; } 100% { transform: scaleY(0.15) scaleX(1.5); opacity: 0; } }
  .drip { fill: #c8fbff; animation: drip 0.75s forwards; }
  @keyframes drip { 0% { transform: none; animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); } 45% { transform: translate(calc(var(--dx) * 0.6), calc(var(--h) * -1)); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5); } 100% { transform: translate(var(--dx), 1.5px) scale(0.6); opacity: 0; } }
  .aim { fill: none; stroke: var(--pink); stroke-width: 0.7; transition: transform 0.18s ease-out; }
  .cellhit { fill: transparent; }
  .grid.target .cellhit { cursor: crosshair; }
  .grid.shake { animation: shake 0.4s; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  .grid.dim { opacity: 0.5; transition: opacity 0.3s; }

  .label { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; }
  .fleet { display: flex; gap: 5px; align-items: center; }
  .fleet i { display: block; height: 7px; border-radius: 4px; background: var(--sea); box-shadow: 0 0 6px rgba(37, 227, 238, 0.6); }
  .fleet i.down { background: var(--hit); opacity: 0.45; box-shadow: none; }

  .status { min-height: 46px; margin-top: 8px; text-align: center; display: grid; place-items: center; }
  .status b { font-family: "Syne", sans-serif; font-weight: 800; font-size: clamp(1.5rem, 8vw, 2.2rem); line-height: 1; }
  .status b.pop { animation: pop 0.5s var(--ease); }
  .status b.hit { color: var(--hit); text-shadow: 0 0 14px rgba(255, 122, 47, 0.7); }
  .status b.miss { color: var(--sea); text-shadow: 0 0 12px rgba(37, 227, 238, 0.6); }
  .status b.win { color: var(--gold); text-shadow: 0 0 14px rgba(255, 210, 63, 0.7); }
  .status b.lose { color: #ff5a5a; text-shadow: 0 0 14px rgba(255, 90, 90, 0.6); }
  .status .hint { color: var(--muted); letter-spacing: 0.08em; font-size: 0.92rem; }
  @keyframes pop { 0% { transform: scale(0.4) rotate(-6deg); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: none; } }

  .tools { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
  .tools button, .share { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 100px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); font-weight: 700; }
  .tools button:active { transform: scale(0.96); }
  .tools .go { order: 2; flex: 1; max-width: 220px; justify-content: center; background: var(--sea); color: #031417; border-color: transparent; font-family: "Syne", sans-serif; font-weight: 800; font-size: 1.1rem; box-shadow: 0 0 18px rgba(37, 227, 238, 0.45); }

  .cta {
    width: min(100%, 380px); margin: 14px auto 0;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 17px; border-radius: 22px;
    background: var(--sea); color: #031417;
    font-family: "Syne", sans-serif; font-weight: 800; font-size: min(1.2rem, 5.2vw); white-space: nowrap;
    box-shadow: 0 0 22px rgba(37, 227, 238, 0.5), 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  .cta:active { transform: scale(0.97); }
  #play .again { margin-top: 12px; padding: 15px; }
  #play + .seg, #play + .seg + .seg { margin-top: 18px; }
  .cta.wait { background: #12343a; color: rgba(242, 240, 234, 0.5); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }

  /* two phones */
  .lobby { text-align: center; margin-top: 18px; }
  .qr { width: min(70%, 240px); aspect-ratio: 1; margin: 12px auto 0; border-radius: 22px; padding: 6px; background: #f2f0ea; box-shadow: 0 0 0 3px var(--sea), 0 0 30px rgba(37, 227, 238, 0.5); }
  .qr svg { display: block; width: 100%; height: 100%; }
  .share { margin-top: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 100px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; color: #ff6b6b; border: 1px solid rgba(255, 90, 90, 0.55); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #ff5a5a; box-shadow: 0 0 8px #ff5a5a; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }
  .pill.off { color: var(--muted); border-color: var(--line); }
  .pill.off i { background: var(--muted); box-shadow: none; animation: none; }
  .netline { text-align: center; margin-top: 10px; }

  /* the curtain between turns, on one phone */
  .curtain { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center; padding: 24px;
    background: radial-gradient(60% 40% at 50% 45%, rgba(37, 227, 238, 0.18), transparent 70%), rgba(7, 8, 15, 0.97); }
  .curtain b { font-family: "Syne", sans-serif; font-weight: 800; font-size: clamp(2.2rem, 12vw, 3.4rem); line-height: 1; color: var(--sea); text-shadow: 0 0 16px rgba(37, 227, 238, 0.6); }
  .curtain svg { width: 120px; height: 70px; overflow: visible; }
  .curtain .bob { animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(3px) rotate(-2deg); } }
  .deal { text-align: center; margin-top: 22px; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em; }
  .confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .sweep, .ship.sunk rect, .curtain .bob { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="play.html">&larr; Play.</a>
  <button class="sound" id="sound" aria-label="Sound on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
  <h1>Battleships<span>.</span></h1>
  <div class="seg" id="mode" role="group" aria-label="Opponent">
    <button data-m="cpu">&#129302; vs Robo</button>
    <button data-m="two">&#128101; 2 players</button>
    <button data-m="net">&#128241; 2 phones</button>
  </div>
  <div class="seg lv" id="level" role="group" aria-label="How good Robo is">
    <button data-l="0">Cadet</button>
    <button data-l="1">Captain</button>
    <button data-l="2">Admiral</button>
  </div>
  <div class="score" id="score"><span id="n0">You</span><b id="s0">0</b><i>–</i><b id="s1">0</b><span id="n1">Robo</span></div>

  <!-- two phones: waiting for the friend -->
  <div class="lobby" id="lobby" hidden>
    <p class="small">Friend scans to play</p>
    <div class="qr" id="qr"></div>
    <button class="share" id="share"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share link</button>
    <p class="small" id="lobby-note" style="margin-top:14px">Waiting for a friend…</p>
  </div>

  <!-- placing the fleet -->
  <section id="place" hidden>
    <p class="small" id="place-who" style="margin-top:16px">Place your fleet</p>
    <p class="small" style="margin-top:4px;opacity:0.7;text-transform:none;letter-spacing:0.04em">Drag to move · tap to turn</p>
    <div class="tools">
      <button class="go" id="ready">Ready</button>
      <button id="shuffle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle</button>
    </div>
    <div class="grid" id="g-place"></div>
  </section>

  <!-- the battle -->
  <section id="play" hidden>
    <button class="cta again" id="again" hidden>Again</button>
    <div class="label"><span class="small" id="t-label">Enemy waters</span><span class="fleet" id="fleet-t"></span></div>
    <div class="grid target" id="g-target"></div>
    <div class="below">
      <div class="grid mini" id="g-own"></div>
      <div class="side">
        <div class="status" id="status" aria-live="polite"></div>
        <span class="small" id="o-label">Your fleet</span>
        <span class="fleet" id="fleet-o"></span>
      </div>
    </div>
  </section>
  <button class="cta" id="cta" hidden></button>
  <p class="netline" id="netline" hidden><span class="pill" id="pill"><i></i><b>LIVE</b></span></p>
  <p class="deal">Nothing stored here. Your fleet stays on your phone.</p>
</div>
<div class="curtain" id="curtain" hidden>
  <svg viewBox="0 0 120 70" aria-hidden="true"><g class="bob"><path d="M10 40 H110 L96 58 H24 Z" fill="#140e2a" stroke="#25e3ee" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 40 V26 H70 V40 M50 26 V16 H60 V26" fill="#140e2a" stroke="#ff4fd8" stroke-width="2.2" stroke-linejoin="round"/><path d="M84 40 V32 H96" fill="none" stroke="#ffd23f" stroke-width="2.2"/></g><path d="M0 64 q7.5 -5 15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0" fill="none" stroke="#25e3ee" stroke-width="2" opacity="0.6"/></svg>
  <span class="small">Pass to</span>
  <b id="curtain-who">Player 2</b>
  <span class="small" style="margin-top:8px">No peeking</span>
  <button class="cta" id="curtain-go" style="margin-top:22px;width:min(80vw,320px)"></button>
</div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<script src="assets/duo.js"></script>
<script>
/* Battleships. — against Robo, a friend passing the phone, or a friend on
   their own phone. The game lives in the page's own address. On two
   phones each fleet stays on its own phone: a shot goes across, the phone
   it hit says what it hit, and that's all that's ever sent. */
(() => {
  const $ = (s, r) => (r || document).querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = (n) => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  const pick = (a) => a[rnd(a.length)];
  const SHIPS = [{ n: "Carrier", len: 5, col: "#ff4fd8" }, { n: "Battleship", len: 4, col: "#a77bff" }, { n: "Cruiser", len: 3, col: "#39ff88" }, { n: "Submarine", len: 3, col: "#ffd23f" }, { n: "Destroyer", len: 2, col: "#4d8bff" }];

  // ---- the state -------------------------------------------------------------------
  // fl[p]: player p's fleet, five { x, y, v }; sh[p]: p's shots at the other,
  // { c, r: 0 miss / 1 hit / 2 sunk, s: the ship sunk } (r is missing while a
  // shot's on its way, on two phones); rd: ready; first: who fires first;
  // win: -1 still going. On two phones this phone is always player 0.
  const blank = (m) => ({ m, lv: 1, sc: [0, 0], g: 0, fl: [null, null], sh: [[], []], rd: [false, false], first: 0, at: 0, win: -1 });
  let S = blank("cpu");
  const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const dec = (t) => JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g, "+").replace(/_/g, "/")))));
  const save = (fromFriend) => { try { history.replaceState(null, "", "#" + enc(S)); } catch (_) {} if (!fromFriend && S.m === "net") sendSync(); };
  const JOIN = Duo.fromHash();
  if (JOIN) S = Object.assign(blank("net"), { role: "guest", me: Duo.id(6), L: JOIN });
  else try { const o = location.hash.length > 3 && dec(location.hash.slice(1)); if (o && o.m && Array.isArray(o.sh)) S = Object.assign(blank(o.m), o); } catch (_) {}

  // ---- ships and cells -----------------------------------------------------------------
  const cellsOf = (i, s) => Array.from({ length: SHIPS[i].len }, (_, k) => (s.y + (s.v ? k : 0)) * 10 + s.x + (s.v ? 0 : k));
  const fits = (i, s, fleet, skip) => {
    const len = SHIPS[i].len;
    if (s.x < 0 || s.y < 0 || (s.v ? s.y + len > 10 || s.x > 9 : s.x + len > 10 || s.y > 9)) return false;
    const mine = cellsOf(i, s);
    return fleet.every((o, j) => j === i || j === skip || !o || !cellsOf(j, o).some((c) => mine.includes(c)));
  };
  const randomFleet = () => {   // ships don't touch, if it can manage it
    for (let tries = 0; tries < 50; tries++) {
      const f = [], used = new Set();
      let ok = true;
      for (let i = 0; i < SHIPS.length && ok; i++) {
        let placed = false;
        for (let k = 0; k < 300 && !placed; k++) {
          const s = { x: rnd(10), y: rnd(10), v: rnd(2) };

    const sh = fx(L, "circle", { class: "shadow", cx, cy, r: 2.4 }, 430);
    const b = el("g", { class: "bomb", style: `--fx:${side * 16}px;--fr:${side * -30}deg` });
    b.innerHTML = `<path class="fin" d="M${cx - 1.9} ${cy - 4.6}L${cx} ${cy - 2.4}L${cx + 1.9} ${cy - 4.6}Z"/><ellipse class="body" cx="${cx}" cy="${cy}" rx="1.9" ry="2.6"/><circle cx="${cx - 0.6}" cy="${cy - 0.8}" r="0.5" fill="#f2f0ea" opacity="0.7"/>`;
    L.fx.appendChild(b); setTimeout(() => { b.remove(); sh.remove(); res(); }, 420);
  });
  const roboTurn = () => {
    busy = true; render();
    // a crosshair wanders over your fleet, then settles
    const c = roboShot(), aim = el("rect", { class: "aim", x: -4.5, y: -4.5, width: 9, height: 9, rx: 1.5 });
    OW.fx.appendChild(aim);
    let k = 0; const hops = 2 + rnd(2);
    const hop = () => {
      const t = k < hops ? rnd(100) : c, [x, y] = cxy(t);
      aim.style.transform = "translate(" + x + "px," + y + "px)"; sfx.tick();
      if (k++ < hops) setTimeout(hop, 150); else setTimeout(() => { aim.remove(); busy = false; fireLocal(1, c); }, 200);
    };
    hop();
  };
  $("#g-target").addEventListener("click", (e) => {
    audio();
    if (S.win >= 0) return;
    const me = viewer(), r = $("#g-target").getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * 10), y = Math.floor((e.clientY - r.top) / r.height * 10);
    if (x < 0 || y < 0 || x > 9 || y > 9) return;
    const c = y * 10 + x;
    if (busy || flash || nextUp() !== me || (S.m === "net" && (!net.peer || !S.rd[1] || pending()))) { buzz(15); return; }
    if (S.sh[me].some((s) => s.c === c)) { sfx.nope(); buzz(25); const g = $("#g-target"); g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake"); return; }
    if (S.m === "net") return fireNet(c);
    fireLocal(me, c);
  });

  // ---- one phone, two players: the curtain between goes ------------------------------
  const curtain = (p, then) => {
    const cu = $("#curtain"); $("#curtain-who").textContent = names()[p];
    cu.hidden = false; S.cu = p; save();
    const go = $("#curtain-go"); go.textContent = "I'm " + names()[p];
    go.onclick = () => { audio(); cu.hidden = true; delete S.cu; save(); buzz(10); (then || render)(); };
  };

  // ---- two phones ---------------------------------------------------------------------
  // Each phone sends its whole side of things: its shots so far, and the
  // results of the friend's shots at it (which only it can work out). The
  // friend folds that in, so a dropped message or a reload just catches up.
  var duo = null, net = { sock: "off", peer: false, full: false };
  function sendSync() {
    if (!duo) return;
    duo.send({ k: "sync", g: S.g, rd: S.rd[0], out: S.sh[0].map((x) => x.c), inc: S.sh[1], seen: S.sh[0].filter((x) => x.r !== undefined).length, hrd: S.rd[1], hfl: !!S.fl[1], fl: S.win >= 0 ? S.fl[0] : null });
  }
  const netFirst = () => ((S.g % 2 === 0) === (S.role === "host") ? 0 : 1);   // the host starts the even games
  const newNetGame = (g) => {   // (g first: who starts depends on the new game's number)
    S.g = g; Object.assign(S, { fl: [randomFleet(), null], sh: [[], []], rd: [false, false], first: netFirst(), win: -1 }); placeFor = 0;
  };
  const fireNet = async (c) => {
    S.sh[0].push({ c }); sfx.fire(); save(); paintPlay();
    await aimPing(0, c);
  };
  const onFriend = async (o) => {
    if (o.k === "hi") return sendSync();
    if (o.k !== "sync" || !Number.isInteger(o.g)) return;
    if (o.g < S.g) return sendSync();
    let changed = false;
    if (o.g > S.g) { newNetGame(o.g); changed = true; flash = null; }
    if (S.rd[1] !== !!o.rd) { S.rd[1] = !!o.rd; changed = true; }
    // their shots at me: work out each new one, in turn
    const outs = Array.isArray(o.out) ? o.out : [], fresh = [];
    for (let j = S.sh[1].length; j < outs.length && S.win < 0; j++) {
      const c = outs[j];
      if (!Number.isInteger(c) || c < 0 || c > 99 || S.sh[1].some((x) => x.c === c)) break;
      if (S.sh[0].length < j + (S.first === 1 ? 0 : 1)) break;   // not their go yet
      const x = resolve(S.fl[0], S.sh[1], c); S.sh[1].push(x); fresh.push(x); changed = true;
    }
    // the results of my shots at them
    let mine = null;
    (Array.isArray(o.inc) ? o.inc : []).forEach((r, i) => {
      const x = S.sh[0][i];
      if (!x || x.c !== r.c || x.r !== undefined) return;
      x.r = r.r === 2 ? 2 : r.r ? 1 : 0;
      if (x.r === 2 && Number.isInteger(r.s) && r.s >= 0 && r.s < 5) { x.s = r.s; if (r.p && Number.isInteger(r.p.x) && Number.isInteger(r.p.y)) x.p = { x: r.p.x, y: r.p.y, v: r.p.v ? 1 : 0 }; }
      mine = x; changed = true;
    });
    if (Array.isArray(o.fl) && o.fl.length === 5 && !S.fl[1]) { S.fl[1] = o.fl; changed = true; }
    // answer straight away (the friend's waiting on these results), then put on the show
    if (changed || (o.seen | 0) < S.sh[1].length || (Array.isArray(o.inc) ? o.inc.length : 0) < S.sh[0].length || o.hrd !== S.rd[0] || (S.win >= 0 && !o.hfl)) { save(true); sendSync(); }
    if (changed) {
      render();
      if (mine) { paintPlay({ p: 0, c: mine.c }); land(mine, 0); const over = checkWin(); await say(mine, 0, over ? 900 : 1200); render(); }
      if (fresh.length) busy = true;   // hold fire till their bomb's landed (it might be the last one)
      for (const x of fresh) { await aimPing(1, x.c); paintPlay({ p: 1, c: x.c }); land(x, 1); const over = checkWin(); await say(x, 1, over ? 900 : 1100); render(); }
      if (fresh.length) { busy = false; render(); }
    }
  };
  function goOnline() {
    if (duo || !S.L) return;
    duo = Duo.connect({
      room: S.L, role: S.role, me: S.me,
      onPeer: () => { save(true); if (S.role === "host") { buzz([20, 40, 20]); sfx.win(); } render(); },
      onMsg: onFriend,
      // waiting on them: they're placing, it's their go, our shot's in the air, or we've not seen their fleet at the end
      waiting: () => !!(S.L && S.L.peer) && (S.win < 0 ? S.rd[0] && (!S.rd[1] || pending() || nextUp() === 1) : !S.fl[1]),
      nudge: sendSync,
      onState: (st) => { net = st; paintPill(); if (!$("#play").hidden) paintPlay(); else render(); },
    });
  }
  function goOffline() { if (duo) duo.stop(); duo = null; delete S.L; delete S.role; delete S.me; net = { sock: "off", peer: false, full: false }; }
  const paintPill = () => {
    const p = $("#pill"), live = net.sock === "on" && net.peer;
    p.classList.toggle("off", !live); $("b", p).textContent = live ? "LIVE" : net.sock !== "on" ? "OFFLINE" : "FRIEND AWAY";
  };
  $("#share").addEventListener("click", () => S.L && Duo.share(Duo.joinUrl(S.L), "Battleships. — play me", () => {}));

  // ---- the big button ---------------------------------------------------------------
  let ctaAct = null;
  const cta = (label, act, wait) => {
    const b = $("#cta"); b.hidden = !label; if (!label) return;
    b.textContent = label; b.classList.toggle("wait", !!wait); ctaAct = act;
  };
  $("#cta").addEventListener("click", () => { audio(); if (!$("#cta").classList.contains("wait") && ctaAct) ctaAct(); else buzz(15); });

  // ---- which screen ---------------------------------------------------------------------
  const ready = () => {   // a fleet's placed
    buzz([15, 30, 15]); sfx.splash();
    if (S.m === "cpu") { S.rd = [true, true]; S.fl[1] = randomFleet(); save(); render(); if (nextUp() === 1) roboTurn(); return; }
    if (S.m === "two") {
      S.rd[placeFor] = true; save();
      if (!S.rd[1]) { placeFor = 1; if (!S.fl[1]) S.fl[1] = randomFleet(); save(); return curtain(1, render); }
      return curtain(nextUp(), render);
    }
    S.rd[0] = true; save(); render();
  };
  const again = () => {
    S.g++; S.sh = [[], []]; S.rd = [false, false]; S.win = -1; flash = null;
    if (S.m === "net") { newNetGame(S.g); save(); return render(); }
    S.first = S.g % 2; S.fl = [randomFleet(), S.m === "cpu" ? null : randomFleet()]; placeFor = 0;
    save(); render();
  };
  // the opponent and level choices: up top, or tucked under the grids once a game's over
  const settingsBelow = (below) => {
    const m = $("#mode"), l = $("#level"), at = below ? $("#play") : $("#score");
    if (below ? m.previousElementSibling !== at : m.nextElementSibling !== l || l.nextElementSibling !== at) { at.parentNode.insertBefore(m, below ? at.nextSibling : at); m.after(l); }
  };
  $("#again").addEventListener("click", () => { audio(); buzz(10); again(); });
  function render() {
    const net2 = S.m === "net", paired = !net2 || (S.L && S.L.peer);
    $("#mode").hidden = false; $("#again").hidden = true;
    document.querySelectorAll("#mode button").forEach((b) => b.classList.toggle("on", b.dataset.m === S.m));
    document.querySelectorAll("#level button").forEach((b) => b.classList.toggle("on", +b.dataset.l === S.lv));
    $("#level").hidden = S.m !== "cpu" || (S.sh[0].length > 0 && S.win < 0);
    const N = names(); $("#n0").textContent = N[0]; $("#n1").textContent = N[1]; $("#s0").textContent = S.sc[0]; $("#s1").textContent = S.sc[1];
    $("#netline").hidden = !net2 || !paired; paintPill();
    // waiting for a friend to scan
    $("#lobby").hidden = paired;
    if (!paired) {
      $("#place").hidden = $("#play").hidden = true;
      if (S.L) Duo.qr($("#qr"), Duo.joinUrl(S.L));
      $("#lobby-note").textContent = S.role === "guest" ? (net.full ? "That game's full" : "Joining…") : "Waiting for a friend…";
      $("#share").hidden = S.role === "guest"; $("#lobby .qr").hidden = S.role === "guest";
      settingsBelow(false); return cta("");
    }
    // placing
    const me = S.m === "two" ? placeFor : 0;
    if (!S.rd[me] || (S.m === "two" && !(S.rd[0] && S.rd[1]))) {
      placeFor = S.m === "two" ? (S.rd[0] ? 1 : 0) : 0;
      if (!S.fl[placeFor]) { S.fl[placeFor] = randomFleet(); save(); }
      $("#place").hidden = false; $("#play").hidden = true;
      $("#place-who").textContent = S.m === "two" ? N[placeFor] + " · place your fleet" : "Place your fleet";
      paintPlace(); settingsBelow(false);
      return cta("");
    }
    $("#place").hidden = true; $("#play").hidden = false;
    $("#mode").hidden = S.win < 0; $("#level").hidden = S.win < 0 || S.m !== "cpu";   // out of the way while the shells fly
    settingsBelow(S.win >= 0);   // and after, below the grids, so nothing jumps and Again stays in reach
    paintPlay();
    $("#again").hidden = S.win < 0;
    if (S.win >= 0) cta("");
    else if (net2 && !S.rd[1]) cta("Friend's placing their fleet…", null, true);
    else cta("");
  }

  // ---- settings ------------------------------------------------------------------------
  const restart = (m) => {
    const lv = S.lv; if (S.m === "net") goOffline();
    S = Object.assign(blank(m), { lv }); S.fl[0] = randomFleet(); placeFor = 0; flash = null; busy = false;
    $("#curtain").hidden = true;
  };
  document.querySelectorAll("#mode button").forEach((b) => b.addEventListener("click", async () => {
    if (busy || S.m === b.dataset.m) return;
    const m = b.dataset.m;
    if (m === "net" && !Duo.ok()) return;
    restart(m);
    if (m === "net") { S.role = "host"; S.me = Duo.id(6); S.L = await Duo.newRoom(); S.first = netFirst(); goOnline(); }
    save(); render();
  }));
  document.querySelectorAll("#level button").forEach((b) => b.addEventListener("click", () => { if (busy) return; S.lv = +b.dataset.l; save(); render(); }));

  // ---- go -----------------------------------------------------------------------------
  if (!S.fl[0]) { S.fl[0] = randomFleet(); if (S.m !== "net") save(); }
  if (S.m === "net") { if (JOIN) S.first = netFirst(); save(true); goOnline(); }
  render();
  if (S.m === "two" && S.cu !== undefined) curtain(S.cu, render);
  else if (S.m === "cpu" && S.rd[0] && S.win < 0 && nextUp() === 1) roboTurn();
})();
</script>
</body>
</html>
