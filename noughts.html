<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<title>Noughts. — noughts and crosses</title>
<meta name="description" content="Glow-in-the-dark noughts and crosses. Take on the robot, or a friend on the same phone. Try Vanishing: only your last three stay. Nothing stored.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/syne-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Syne"; font-weight: 800; font-display: swap; src: url("assets/fonts/syne-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 500; font-display: swap; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; font-display: swap; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }

  /* A neon sign of a game: pink crosses, cyan noughts, a gold laser for the win. */
  :root {
    --bg: #07080f;
    --ink: #f2f0ea;
    --muted: rgba(242, 240, 234, 0.55);
    --line: rgba(242, 240, 234, 0.12);
    --x: #ff4fd8;
    --o: #25e3ee;
    --gold: #ffd23f;
    --turf: #39ff88;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  body {
    min-height: 100svh; color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 500;
    background:
      radial-gradient(80% 45% at 15% -5%, rgba(255, 79, 216, 0.16), transparent 70%),
      radial-gradient(80% 45% at 85% 105%, rgba(37, 227, 238, 0.14), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow-x: hidden;
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .wrap { width: min(100%, 520px); margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); position: relative; }
  .home { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; color: var(--muted); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.14em; }
  .sound { position: absolute; top: max(6px, env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .sound svg { width: 20px; height: 20px; }
  h1 { font-family: "Syne", sans-serif; font-weight: 800; font-size: clamp(2.4rem, 12vw, 3.8rem); line-height: 0.9; letter-spacing: -0.02em; text-align: center; margin-top: 28px; }
  h1 .x { color: var(--x); text-shadow: 0 0 8px var(--x), 0 0 26px rgba(255, 79, 216, 0.6); }

  /* ---------- the score ---------- */
  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 20px; }
  .side { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); transition: border-color 0.3s, box-shadow 0.3s, background 0.3s; min-width: 0; }
  .side.o { flex-direction: row-reverse; text-align: right; }
  .side svg.mk { width: 26px; height: 26px; flex: none; }
  .side .who { flex: 1; min-width: 0; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side b { font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1; }
  .side.x.turn { border-color: var(--x); box-shadow: 0 0 16px rgba(255, 79, 216, 0.35); background: rgba(255, 79, 216, 0.08); }
  .side.o.turn { border-color: var(--o); box-shadow: 0 0 16px rgba(37, 227, 238, 0.35); background: rgba(37, 227, 238, 0.08); }
  .side.bump b { animation: bump 0.6s var(--ease); }
  @keyframes bump { 30% { transform: scale(1.5); color: var(--gold); text-shadow: 0 0 12px var(--gold); } }
  .draws { text-align: center; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.3; }
  .draws b { display: block; font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- the robot ---------- */
  .bot { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; min-height: 56px; }
  .bot svg { width: 56px; height: 56px; flex: none; overflow: visible; }
  .bot .eyes { transition: transform 0.18s ease-out; }
  .bot .ant { transform-box: fill-box; transform-origin: 50% 100%; }
  .bot.think .ant { animation: wob 0.5s ease-in-out infinite alternate; }
  @keyframes wob { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  .bot.think .bulb { animation: blink 0.25s steps(1) infinite; }
  @keyframes blink { 50% { fill: #07080f; } }
  .bot .mouth { transition: d 0.25s; }
  .bubble { position: relative; max-width: 62%; padding: 9px 14px; border-radius: 16px; background: #151827; border: 1px solid var(--line); font-weight: 700; font-size: 0.95rem; opacity: 0; transform: translateY(4px) scale(0.95); transition: opacity 0.25s, transform 0.25s var(--ease); }
  .bubble.on { opacity: 1; transform: none; }
  .bubble::before { content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; margin-top: -6px; background: #151827; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }

  /* ---------- the board ---------- */
  .board { position: relative; width: min(100%, 360px, 48svh); aspect-ratio: 1; margin: 12px auto 0; }
  .board svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .grid line { stroke: #a77bff; stroke-width: 3; stroke-linecap: round; }
  .grid { animation: hum 4s ease-in-out infinite; }
  @keyframes hum { 50% { opacity: 0.8; } }
  .cell { fill: transparent; cursor: pointer; }
  .cell:active { fill: rgba(255, 255, 255, 0.04); }
  .mark path, .mark circle { fill: none; stroke-width: 9; stroke-linecap: round; }
  .mark.x path { stroke: var(--x); }
  .mark.o circle { stroke: var(--o); }
  .mark.draw path, .mark.draw circle { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: ink 0.32s var(--ease) forwards; }
  .mark.draw path + path { animation-delay: 0.14s; }
  @keyframes ink { to { stroke-dashoffset: 0; } }
  .mark.old { animation: flicker 1.1s steps(1) infinite; }
  @keyframes flicker { 0%, 40%, 60%, 100% { opacity: 0.85; } 45% { opacity: 0.2; } 55% { opacity: 0.45; } 70% { opacity: 0.35; } }
  .mark.gone { transform-box: fill-box; transform-origin: center; animation: poof 0.35s ease-in forwards; }
  @keyframes poof { to { opacity: 0; transform: scale(1.5) rotate(25deg); } }
  .mark.win { animation: winp 0.7s ease-in-out infinite alternate; }
  @keyframes winp { to { opacity: 0.55; } }
  .ghost { opacity: 0.18; pointer-events: none; }
  .laser { stroke: var(--gold); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: zap 0.45s var(--ease) 0.15s forwards; }
  @keyframes zap { to { stroke-dashoffset: 0; } }
  .board.shake { animation: shake 0.35s; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

  .result { min-height: 48px; margin-top: 8px; text-align: center; }
  .result b { font-family: "Syne", sans-serif; font-weight: 800; font-size: clamp(1.8rem, 9vw, 2.6rem); line-height: 1; display: inline-block; animation: pop 0.55s var(--ease); }
  .result b.x { color: var(--x); text-shadow: 0 0 14px var(--x); }
  .result b.o { color: var(--o); text-shadow: 0 0 14px var(--o); }
  .result b.d { color: var(--gold); text-shadow: 0 0 14px rgba(255, 210, 63, 0.6); }
  .result .hint { color: var(--muted); letter-spacing: 0.08em; font-size: 0.9rem; line-height: 54px; }
  @keyframes pop { 0% { transform: scale(0.4) rotate(-6deg); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: none; } }
  .again { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px auto 0; padding: 13px 26px; border-radius: 100px; background: var(--gold); color: #1a1403; font-weight: 700; box-shadow: 0 0 18px rgba(255, 210, 63, 0.45); }
  .again:active { transform: scale(0.96); }

  /* ---------- settings ---------- */
  .seg { display: flex; gap: 6px; padding: 5px; margin: 24px auto 0; border-radius: 100px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); }
  .seg button { flex: 1; padding: 10px 0; border-radius: 100px; font-weight: 700; color: var(--muted); transition: background 0.2s, color 0.2s; white-space: nowrap; }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .seg.top { margin-top: 16px; }
  .seg.top button { font-size: 0.9rem; }
  /* two phones: the QR code to join, and whether the friend's about */
  .lobby { text-align: center; margin-top: 18px; }
  .small { color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.8rem; margin-top: 10px; }
  .qr { width: min(70%, 240px); aspect-ratio: 1; margin: 12px auto 0; border-radius: 22px; padding: 6px; background: #f2f0ea; box-shadow: 0 0 0 3px var(--x), 0 0 30px rgba(255, 79, 216, 0.5); }
  .qr svg { display: block; width: 100%; height: 100%; }
  .share { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 11px 18px; border-radius: 100px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); font-weight: 700; }
  .netline { text-align: center; margin-top: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 100px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; color: #ff6b6b; border: 1px solid rgba(255, 90, 90, 0.55); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #ff5a5a; box-shadow: 0 0 8px #ff5a5a; animation: hum 1.2s ease-in-out infinite; }
  .pill.off { color: var(--muted); border-color: var(--line); }
  .pill.off i { background: var(--muted); box-shadow: none; animation: none; }
  .seg.lv { margin-top: 24px; }
  .seg.lv button { font-size: 0.88rem; }
  .switch { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 10px; padding: 12px 14px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); text-align: left; }
  .switch span { flex: 1; }
  .switch small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .switch i { position: relative; width: 44px; height: 26px; border-radius: 13px; background: rgba(255, 255, 255, 0.12); flex: none; transition: background 0.2s; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); transition: transform 0.2s var(--ease); }
  .switch.on { border-color: rgba(167, 123, 255, 0.6); }
  .switch.on i { background: #a77bff; box-shadow: 0 0 12px rgba(167, 123, 255, 0.6); }
  .switch.on i::after { transform: translateX(18px); }
  .reset { display: block; margin: 16px auto 0; padding: 8px 14px; border-radius: 100px; border: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }
  .reset.arm { border-color: #ff5a5a; color: #ff8a80; }
  .deal { text-align: center; margin-top: 22px; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em; }

  .confetti { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
  @media (max-width: 359px) { .side .who { display: none; } .side { justify-content: space-between; } }
  @media (prefers-reduced-motion: reduce) {
    .grid, .mark.old, .mark.win, .bot.think .ant, .bot.think .bulb { animation: none; }
    .mark.draw path, .mark.draw circle { animation-duration: 0.01s; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="./">&larr; PR.</a>
  <button class="sound" id="sound" aria-label="Sound on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
  <h1>Noughts<span class="x">.</span></h1>
  <div class="seg top" id="mode" role="group" aria-label="Opponent">
    <button data-m="cpu">&#129302; vs Robo</button>
    <button data-m="two">&#128101; 2 players</button>
    <button data-m="net">&#128241; 2 phones</button>
  </div>

  <div class="score">
    <div class="side x" id="side-x"><svg class="mk" viewBox="0 0 30 30"><path d="M7 7L23 23M23 7L7 23" stroke="#ff4fd8" stroke-width="4.5" stroke-linecap="round"/></svg><span class="who" id="name-x">You</span><b id="sc-x">0</b></div>
    <div class="draws">Draws<b id="sc-d">0</b></div>
    <div class="side o" id="side-o"><svg class="mk" viewBox="0 0 30 30"><circle cx="15" cy="15" r="9" fill="none" stroke="#25e3ee" stroke-width="4.5"/></svg><span class="who" id="name-o">Robo</span><b id="sc-o">0</b></div>
  </div>

  <div class="bot" id="bot">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs><filter id="bg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <g class="ant"><line x1="32" y1="14" x2="32" y2="5" stroke="#25e3ee" stroke-width="2.5" stroke-linecap="round"/><circle class="bulb" cx="32" cy="4" r="3.4" fill="#ffd23f" filter="url(#bg)"/></g>
      <rect x="10" y="14" width="44" height="38" rx="11" fill="#140e2a" stroke="#25e3ee" stroke-width="2.5" filter="url(#bg)"/>
      <rect x="5" y="27" width="5" height="12" rx="2" fill="#25e3ee"/><rect x="54" y="27" width="5" height="12" rx="2" fill="#25e3ee"/>
      <g class="eyes" id="eyes"><circle cx="24" cy="29" r="4.4" fill="#f2f0ea"/><circle cx="40" cy="29" r="4.4" fill="#f2f0ea"/><circle cx="24" cy="29" r="2" fill="#07080f"/><circle cx="40" cy="29" r="2" fill="#07080f"/></g>
      <path class="mouth" id="mouth" d="M24 42 Q32 42 40 42" fill="none" stroke="#ff4fd8" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <div class="bubble" id="bubble"></div>
  </div>

  <div class="lobby" id="lobby" hidden>
    <p class="small">Friend scans to play</p>
    <div class="qr" id="qr"></div>
    <button class="share" id="share"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share link</button>
    <p class="small" id="lobby-note">Waiting for a friend…</p>
  </div>
  <div class="board" id="board">
    <svg viewBox="0 0 300 300" id="svg">
      <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <g class="grid" filter="url(#glow)"><line x1="100" y1="12" x2="100" y2="288"/><line x1="200" y1="12" x2="200" y2="288"/><line x1="12" y1="100" x2="288" y2="100"/><line x1="12" y1="200" x2="288" y2="200"/></g>
      <g id="marks" filter="url(#glow)"></g>
      <g id="cells"></g>
      <g id="fx" filter="url(#glow)"></g>
    </svg>
  </div>

  <div class="result" id="result" aria-live="polite"></div>
  <p class="netline" id="netline" hidden><span class="pill" id="pill"><i></i><b>LIVE</b></span></p>
  <button class="again" id="again" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>Again</button>

  <div class="seg lv" id="level" role="group" aria-label="How good Robo is">
    <button data-l="0">Rookie</button>
    <button data-l="1">Pub champ</button>
    <button data-l="2">Unbeatable</button>
  </div>
  <button class="switch" id="vanish" role="switch" aria-checked="false"><span>&#128123; Vanishing<small>Only your last 3 marks stay. No draws.</small></span><i></i></button>
  <button class="reset" id="reset">Reset scores</button>
  <p class="deal">Nothing stored here. The score lives in the link.</p>
</div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<script src="assets/duo.js"></script>
<script>
/* Noughts. — noughts and crosses, against Robo or a friend. The state (who's
   where, the score) lives in the page's own address; nothing's stored or sent. */
(() => {
  const $ = (s, r) => (r || document).querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const rnd = (n) => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  const pick = (a) => a[rnd(a.length)];

  // ---- state: q[0] = X's cells, q[1] = O's, oldest first; t = whose turn ----------
  // two phones: L = the room, role host (X) or guest (O), n = a version, so
  // the newer copy of the game wins whichever phone made it
  const fresh = () => ({ m: "cpu", lv: 1, v: 0, sc: [0, 0, 0], f: 0, q: [[], []], t: 0, end: null, n: 0 });
  let S = fresh();
  const enc = (o) => btoa(JSON.stringify(o)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const save = (fromFriend) => {
    try { history.replaceState(null, "", "#" + enc(S)); } catch (_) {}
    if (!fromFriend && S.m === "net") sendState();
  };
  const JOIN = Duo.fromHash();
  if (JOIN) S = Object.assign(fresh(), { m: "net", role: "guest", me: Duo.id(6), L: JOIN });
  else try {
    const o = location.hash.length > 3 && JSON.parse(atob(location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/")));
    if (o && Array.isArray(o.q) && Array.isArray(o.sc)) S = Object.assign(fresh(), o);
  } catch (_) {}

  // ---- the rules, for both the game and Robo's thinking -------------------------
  const owner = (q, c) => (q[0].includes(c) ? 0 : q[1].includes(c) ? 1 : -1);
  const free = (q) => [4, 0, 2, 6, 8, 1, 3, 5, 7].filter((c) => owner(q, c) < 0);
  const place = (q, p, c, vanish) => {   // returns the new position (and what vanished)
    const n = [q[0].slice(), q[1].slice()];
    let gone = -1;
    if (vanish && n[p].length === 3) gone = n[p].shift();
    n[p].push(c);
    return { q: n, gone };
  };
  const lineOf = (q, p) => LINES.find((l) => l.every((c) => q[p].includes(c))) || null;

  // Robo looks ahead with negamax and alpha-beta: the whole game in the classic
  // version, eight moves deep with Vanishing (which can go on for ever).
  const search = (q, p, depth, ply, a, b, vanish) => {
    const moves = free(q);
    if (!moves.length) return 0;
    let best = -Infinity;
    for (const c of moves) {
      const n = place(q, p, c, vanish).q;
      const s = lineOf(n, p) ? 100 - ply : depth <= 1 ? 0 : -search(n, 1 - p, depth - 1, ply + 1, -b, -a, vanish);
      if (s > best) best = s;
      if (best > a) a = best;
      if (a >= b) break;
    }
    return best;
  };
  const scoreMoves = (q, p, vanish) => free(q).map((c) => {
    const n = place(q, p, c, vanish).q;
    return { c, s: lineOf(n, p) ? 100 : -search(n, 1 - p, vanish ? 7 : 9, 1, -Infinity, Infinity, vanish) };
  });
  const roboMove = () => {
    const ms = scoreMoves(S.q, 1, !!S.v);
    const wins = ms.filter((m) => m.s === 100), top = Math.max(...ms.map((m) => m.s));
    const best = ms.filter((m) => m.s === top).map((m) => m.c);
    if (S.lv === 0) return wins.length && rnd(10) < 6 ? wins[0].c : pick(ms.map((m) => m.c));   // Rookie
    if (S.lv === 1) return wins.length ? wins[0].c : rnd(100) < 70 ? pick(best) : pick(ms.map((m) => m.c));   // Pub champ
    return pick(best);   // Unbeatable
  };

  // ---- sound, haptics, confetti -----------------------------------------------------
  let sound = true, ac = null;
  const audio = () => {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
    if (ac && ac.state === "suspended") ac.resume().catch(() => {});
    return ac;
  };
  addEventListener("pointerdown", audio, { once: true });
  const tone = (f, t0, dur, type, vol, f2) => {
    const a = audio(); if (!a || !sound) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  };
  const sfx = {
    x: () => { tone(880, 0, 0.07, "triangle", 0.12, 1320); tone(1320, 0.07, 0.07, "triangle", 0.1, 880); },
    o: () => tone(520, 0, 0.18, "sine", 0.14, 780),
    poof: () => tone(1200, 0, 0.18, "sawtooth", 0.03, 200),
    win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.07, 0.25, "triangle", 0.13)),
    lose: () => [392, 370, 349, 262].forEach((f, i) => tone(f, i * 0.28, i === 3 ? 0.8 : 0.26, "sawtooth", 0.06)),   // the sad trombone
    draw: () => { tone(440, 0, 0.12, "square", 0.05); tone(440, 0.18, 0.12, "square", 0.05); },
    nope: () => tone(150, 0, 0.12, "square", 0.06),
  };
  $("#sound").addEventListener("click", (e) => {
    sound = !sound;
    e.currentTarget.querySelector(".wave").style.display = sound ? "" : "none";
    e.currentTarget.setAttribute("aria-label", sound ? "Sound on" : "Sound off");
  });
  const buzz = (ms) => { if (navigator.vibrate && !(navigator.userActivation && !navigator.userActivation.hasBeenActive)) navigator.vibrate(ms); };
  const confetti = (cols) => {
    if (reduced) return;
    const cv = $("#confetti"), x = cv.getContext("2d");
    const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
    const bits = Array.from({ length: 130 }, () => ({ x: W / 2, y: H * 0.45, vx: (Math.random() - 0.5) * W * 0.03, vy: -Math.random() * H * 0.025 - H * 0.006, r: (3 + Math.random() * 5) * devicePixelRatio, c: cols[(Math.random() * cols.length) | 0], a: Math.random() * 6 }));
    let f = 0;
    (function tick() {
      x.clearRect(0, 0, W, H);
      bits.forEach((b) => { b.vy += H * 0.0009; b.x += b.vx; b.y += b.vy; b.a += 0.2; x.fillStyle = b.c; x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); x.restore(); });
      if (++f < 110) requestAnimationFrame(tick); else x.clearRect(0, 0, W, H);
    })();
  };

  // ---- Robo's face and patter ---------------------------------------------------------
  const MOUTH = { calm: "M24 42 Q32 42 40 42", smug: "M23 40 Q32 49 41 40", sad: "M23 45 Q32 37 41 45", ooh: "M29 43 Q32 39 35 43 Q32 47 29 43" };
  const SAY = {
    start: ["Your move.", "Ready when you are.", "Go on then.", "Beep. Boop. Begin."],
    think: ["Hmm…", "Calculating…", "Ooh, tricky.", "Let me see…"],
    win: ["Ha! Robo wins!", "Too easy.", "Beep beep, gotcha.", "Better luck next time."],
    lose: ["Not fair!", "I demand a rematch.", "…I let you win.", "Error 404: dignity."],
    draw: ["Stalemate.", "Great minds…", "Nobody wins. Again?"],
    nice: ["Ooh, sneaky.", "Didn't see that.", "Hmm. Clever."],
  };
  let sayT = 0;
  const face = (mood, line) => {
    $("#mouth").setAttribute("d", MOUTH[mood] || MOUTH.calm);
    const b = $("#bubble");
    if (line) { b.textContent = line; b.classList.add("on"); clearTimeout(sayT); sayT = setTimeout(() => b.classList.remove("on"), 2600); }
  };
  const look = (c) => {   // eyes towards a cell (or back to the middle)
    const dx = c == null ? 0 : (c % 3 - 1) * 1.8, dy = c == null ? 0 : (Math.floor(c / 3) - 1) * 1.5;
    $("#eyes").setAttribute("transform", "translate(" + dx + " " + dy + ")");
  };
  const eyeDance = (() => {   // the pupils dart about while Robo thinks
    let t = 0;
    return { start: () => { clearInterval(t); t = setInterval(() => look(pick(free(S.q))), 160); }, stop: () => { clearInterval(t); look(null); } };
  })();

  // ---- drawing --------------------------------------------------------------------------
  const el = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const ctr = (c) => [50 + (c % 3) * 100, 50 + Math.floor(c / 3) * 100];
  const markEl = (p, c, drawIt) => {
    const [x, y] = ctr(c), g = el("g", { class: "mark " + (p ? "o" : "x") + (drawIt && !reduced ? " draw" : ""), "data-c": c });
    if (p === 0) { g.appendChild(el("path", { d: `M${x - 26} ${y - 26}L${x + 26} ${y + 26}`, style: "--len:74" })); g.appendChild(el("path", { d: `M${x + 26} ${y - 26}L${x - 26} ${y + 26}`, style: "--len:74" })); }
    else g.appendChild(el("circle", { cx: x, cy: y, r: 28, style: "--len:176", transform: `rotate(-90 ${x} ${y})` }));
    return g;
  };
  const paint = (newest, gone) => {
    const marks = $("#marks");
    if (gone >= 0) { const g = marks.querySelector('[data-c="' + gone + '"]'); if (g) { g.removeAttribute("data-c"); g.classList.add("gone"); setTimeout(() => g.remove(), 360); } }
    [0, 1].forEach((p) => S.q[p].forEach((c) => { if (!marks.querySelector('[data-c="' + c + '"]')) marks.appendChild(markEl(p, c, c === newest)); }));
    marks.querySelectorAll("[data-c]").forEach((g) => { if (owner(S.q, +g.dataset.c) < 0) g.remove(); });
    // Vanishing: the mark that goes next flickers as a warning
    marks.querySelectorAll(".old").forEach((g) => g.classList.remove("old"));
    if (S.v && !S.end && S.q[S.t].length === 3) { const g = marks.querySelector('[data-c="' + S.q[S.t][0] + '"]'); if (g) g.classList.add("old"); }
    // the score, whose go it is, the names
    $("#sc-x").textContent = S.sc[0]; $("#sc-d").textContent = S.sc[1]; $("#sc-o").textContent = S.sc[2];
    $("#side-x").classList.toggle("turn", !S.end && S.t === 0); $("#side-o").classList.toggle("turn", !S.end && S.t === 1);
    const cpu = S.m === "cpu", net = S.m === "net", me = mySide();
    $("#name-x").textContent = cpu ? "You" : net ? (me ? "Friend" : "You") : "Player X";
    $("#name-o").textContent = cpu ? "Robo" : net ? (me ? "You" : "Friend") : "Player O";
    $("#bot").hidden = !cpu; $("#level").hidden = !cpu;
    const waiting = net && !(S.L && S.L.peer);   // nobody's joined yet: the QR code instead of the board
    $("#lobby").hidden = !waiting; $("#board").hidden = $("#result").hidden = waiting; $("#netline").hidden = !net || waiting;
    if (waiting && S.L) Duo.qr($("#qr"), Duo.joinUrl(S.L));
    $("#lobby-note").textContent = S.role === "guest" ? (netState.full ? "That game's full" : "Joining…") : "Waiting for a friend…";
    $("#share").hidden = S.role === "guest";
    document.querySelectorAll("#mode button").forEach((b) => b.classList.toggle("on", b.dataset.m === S.m));
    document.querySelectorAll("#level button").forEach((b) => b.classList.toggle("on", +b.dataset.l === S.lv));
    $("#vanish").classList.toggle("on", !!S.v); $("#vanish").setAttribute("aria-checked", !!S.v);
    $("#again").hidden = !S.end;
    const res = $("#result");
    if (!S.end) res.innerHTML = '<span class="hint">' + (cpu ? (S.t === 0 ? "Your go" : "Robo's thinking…") : net ? (S.t === me ? "Your go" : "Friend's go") : (S.t === 0 ? "X to go" : "O to go")) + "</span>";
    paintPill();
  };

  // ---- playing ------------------------------------------------------------------------
  let busy = false;
  const play = (c) => {
    const p = S.t, r = place(S.q, p, c, !!S.v);
    S.q = r.q;
    (p ? sfx.o : sfx.x)(); buzz(12);
    if (r.gone >= 0) sfx.poof();
    const line = lineOf(S.q, p);
    if (line) S.end = { w: p, line };
    else if (!free(S.q).length) S.end = { w: -1 };
    else S.t = 1 - p;
    if (S.end) S.sc[S.end.w < 0 ? 1 : S.end.w === 0 ? 0 : 2]++;
    S.n++; save(); paint(c, r.gone);
    if (S.end) finish(true);
    else if (S.m === "cpu" && S.t === 1) roboTurn();
  };
  const roboTurn = () => {
    busy = true; $("#bot").classList.add("think"); eyeDance.start();
    if (rnd(3) === 0) face("calm", pick(SAY.think));
    setTimeout(() => {
      const c = roboMove();
      eyeDance.stop(); look(c); $("#bot").classList.remove("think");
      busy = false;
      play(c);
    }, 450 + rnd(500));
  };
  const finish = (live) => {
    const { w, line } = S.end, fx = $("#fx"); fx.innerHTML = "";
    const res = $("#result"), cpu = S.m === "cpu", net = S.m === "net", me = mySide();
    if (line) {
      const [a, b] = [ctr(line[0]), ctr(line[2])], dx = (b[0] - a[0]) * 0.18, dy = (b[1] - a[1]) * 0.18;
      fx.appendChild(el("line", { class: "laser", x1: a[0] - dx, y1: a[1] - dy, x2: b[0] + dx, y2: b[1] + dy }));
      line.forEach((c) => { const g = $('#marks [data-c="' + c + '"]'); if (g) g.classList.add("win"); });
    }
    const text = w < 0 ? "Draw!" : cpu ? (w === 0 ? "You win!" : "Robo wins!") : net ? (w === me ? "You win!" : "Friend wins!") : (w === 0 ? "X wins!" : "O wins!");
    res.innerHTML = '<b class="' + (w < 0 ? "d" : w ? "o" : "x") + '"></b>'; res.firstChild.textContent = text;
    if (!live) return;
    const side = w < 0 ? null : $(w ? "#side-o" : "#side-x");
    if (side) { side.classList.remove("bump"); void side.offsetWidth; side.classList.add("bump"); }
    if (w < 0) { sfx.draw(); if (cpu) face("ooh", pick(SAY.draw)); }
    else if ((cpu || net) && w !== me) { sfx.lose(); buzz([60, 40, 60]); if (cpu) face("smug", pick(SAY.win)); confetti(["#25e3ee", "#a77bff"]); }
    else { sfx.win(); buzz([20, 40, 60]); confetti(w ? ["#25e3ee", "#ffd23f", "#f2f0ea"] : ["#ff4fd8", "#ffd23f", "#f2f0ea"]); if (cpu) face("sad", pick(SAY.lose)); }
  };
  const newGame = () => {   // whoever didn't start last time starts now
    S.f = 1 - S.f; S.q = [[], []]; S.t = S.f; S.end = null; S.n++;
    $("#fx").innerHTML = ""; $("#marks").innerHTML = "";
    save(); paint();
    if (S.m === "cpu") { face("calm", S.t ? null : pick(SAY.start)); if (S.t === 1) roboTurn(); }
  };

  // the nine cells
  for (let c = 0; c < 9; c++) {
    const [x, y] = ctr(c), r = el("rect", { class: "cell", x: x - 50, y: y - 50, width: 100, height: 100, role: "button", "aria-label": "Square " + (c + 1) });
    r.addEventListener("click", () => {
      audio();
      if (S.end) return newGame();   // a tap after the end: go again
      if (busy || (S.m === "cpu" && S.t === 1)) return;
      if (S.m === "net" && S.t !== mySide()) { buzz(20); return; }   // their go
      if (owner(S.q, c) >= 0) { const b = $("#board"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); sfx.nope(); buzz(30); return; }
      const before = S.m === "cpu" && S.lv === 2 ? scoreMoves(S.q, 0, !!S.v) : null;
      play(c);
      if (before && !S.end && rnd(2) === 0) { const mine = before.find((m) => m.c === c); if (mine && mine.s === Math.max(...before.map((m) => m.s)) && mine.s > 0) face("ooh", pick(SAY.nice)); }
    });
    $("#cells").appendChild(r);
  }
  $("#again").addEventListener("click", newGame);

  // settings: a different game resets the score
  const restart = () => { S.sc = [0, 0, 0]; S.f = 1; newGame(); };
  document.querySelectorAll("#mode button").forEach((b) => b.addEventListener("click", async () => {
    if (busy || S.m === b.dataset.m) return;
    if (S.m === "net") { goOffline(); }
    if (b.dataset.m === "net") {
      if (!Duo.ok()) return;
      S.m = "net"; S.role = "host"; S.me = Duo.id(6); S.L = await Duo.newRoom(); S.n = 0;
      restart(); goOnline(); return;
    }
    S.m = b.dataset.m; restart();
  }));
  document.querySelectorAll("#level button").forEach((b) => b.addEventListener("click", () => { if (busy || S.lv === +b.dataset.l) return; S.lv = +b.dataset.l; restart(); face("calm", ["Easy now.", "Fancy a game?", "I never lose."][S.lv]); }));
  $("#vanish").addEventListener("click", () => { if (busy) return; S.v = S.v ? 0 : 1; restart(); });
  const rs = $("#reset");
  rs.addEventListener("click", () => {
    if (busy) return;
    if (!rs.classList.contains("arm")) { rs.classList.add("arm"); rs.textContent = "Sure?"; setTimeout(() => { rs.classList.remove("arm"); rs.textContent = "Reset scores"; }, 3000); return; }
    rs.classList.remove("arm"); rs.textContent = "Reset scores"; restart();
  });

  // ---- two phones ---------------------------------------------------------------------
  // The host is X, the friend O. Each move (or new game) bumps the version and
  // goes over as the whole game; the newer version wins, so a phone that's been
  // in a pocket just catches up.
  function mySide() { return S.role === "guest" ? 1 : 0; }
  var duo = null, netState = { sock: "off", peer: false, full: false };   // var: save() can run before here
  function paintPill() {
    const p = $("#pill"); if (!p) return;
    const live = netState.sock === "on" && netState.peer;
    p.classList.toggle("off", !live); $("b", p).textContent = live ? "LIVE" : netState.sock !== "on" ? "OFFLINE" : "FRIEND AWAY";
  }
  function sendState() { if (duo) duo.send({ k: "st", n: S.n, q: S.q, t: S.t, end: S.end, sc: S.sc, f: S.f, v: S.v }); }
  const okGame = (o) => Array.isArray(o.q) && o.q.length === 2 && o.q.every((a) => Array.isArray(a) && a.length <= 9 && a.every((c) => Number.isInteger(c) && c >= 0 && c < 9))
    && Array.isArray(o.sc) && o.sc.length === 3 && (o.t === 0 || o.t === 1) && Number.isFinite(o.n);
  const adopt = (o) => {
    const was = { q: S.q, end: S.end };
    Object.assign(S, { n: o.n, q: o.q, t: o.t, end: o.end || null, sc: o.sc.map((x) => x | 0), f: o.f ? 1 : 0, v: o.v ? 1 : 0 });
    save(true);
    if ((!S.q[0].length && !S.q[1].length) || (was.end && !S.end)) { $("#fx").innerHTML = ""; $("#marks").innerHTML = ""; paint(); if (was.end && !S.end) buzz(15); return; }
    const placed = [0, 1].flatMap((p) => S.q[p].filter((c) => !was.q[p].includes(c)).map((c) => ({ p, c })));
    const gone = [0, 1].flatMap((p) => was.q[p].filter((c) => !S.q[p].includes(c)));
    if (placed.length === 1) { (placed[0].p ? sfx.o : sfx.x)(); if (gone.length) sfx.poof(); }
    paint(placed.length === 1 ? placed[0].c : undefined, gone.length === 1 ? gone[0] : -1);
    if (S.end) finish(!was.end);
    else if (S.t === mySide()) buzz(15);
  };
  function goOnline() {
    if (duo || !S.L) return;
    duo = Duo.connect({
      room: S.L, role: S.role, me: S.me,
      onPeer: () => { save(true); paint(); if (S.role === "host") { buzz([20, 40, 20]); sfx.win(); } },
      onMsg: (o) => {
        if (o.k === "hi") return sendState();
        if (o.k === "st" && okGame(o) && (o.n > S.n || (o.n === S.n && S.role === "guest"))) adopt(o);
        else if (o.k === "st" && o.n < S.n) sendState();   // they're behind: catch them up
      },
      onState: (st) => { netState = st; paint(); },
    });
  }
  function goOffline() { if (duo) duo.stop(); duo = null; delete S.L; delete S.role; delete S.me; netState = { sock: "off", peer: false, full: false }; }
  $("#share").addEventListener("click", () => S.L && Duo.share(Duo.joinUrl(S.L), "Noughts. — play me", () => {}));

  // ---- go -----------------------------------------------------------------------------
  if (S.m === "net") { save(true); goOnline(); }   // (a join link becomes this phone's own, so a reload keeps its place)
  paint();
  if (S.end) finish(false);
  else if (S.m === "cpu" && S.t === 1) roboTurn();
  else if (S.m === "cpu" && !S.q[0].length) face("calm", pick(SAY.start));
})();
</script>
